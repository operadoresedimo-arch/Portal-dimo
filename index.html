.login-screen{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:32px}
.login-box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:48px 36px;text-align:center}
.login-logo{font-size:.7rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:36px}
.login-box input{width:100%;padding:14px 16px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-family:inherit;font-size:.85rem;margin-bottom:12px;outline:none;transition:border-color .2s}
.login-box input:focus{border-color:var(--gold)}
.login-box input::placeholder{color:var(--text3)}
.login-btn{width:100%;padding:14px;border:none;border-radius:10px;background:var(--gold);color:#0a1628;font-family:inherit;font-size:.85rem;font-weight:700;cursor:pointer;margin-top:4px;transition:all .2s}
.login-btn:hover{opacity:.9;transform:translateY(-1px)}
.login-error{color:var(--red);font-size:.75rem;margin-top:12px;display:none}
.login-loading{color:var(--text2);font-size:.75rem;margin-top:12px;display:none}

.nav{display:none;position:fixed;top:12px;left:50%;transform:translateX(-50%);background:rgba(15,29,50,.95);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:14px;z-index:50;padding:0 8px}
.nav-inner{display:flex;align-items:center;gap:4px;height:44px;padding:0 12px}
.nav-brand{font-size:.7rem;font-weight:800;color:var(--gold);letter-spacing:.12em;text-transform:uppercase;margin-right:16px}
.nav-tab{padding:6px 16px;border:none;border-radius:8px;font-size:.72rem;font-weight:600;cursor:pointer;font-family:inherit;background:transparent;color:var(--text3);transition:all .2s}
.nav-tab.active{background:rgba(59,130,246,.15);color:var(--blue2)}
.nav-tab:hover{color:var(--text2)}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.nav-user{font-size:.62rem;color:var(--text2)}
.nav-logout{padding:4px 10px;border:1px solid var(--border);border-radius:6px;font-size:.58rem;font-weight:600;cursor:pointer;font-family:inherit;background:transparent;color:var(--text3);transition:all .2s}
.nav-logout:hover{border-color:var(--red);color:var(--red)}

.main{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:72px 20px 40px}
.page{display:none;position:relative;z-index:1}.page.active{display:block}
.loading-msg{text-align:center;padding:60px 20px;color:var(--text2);font-size:.85rem}

.date-header{text-align:center;margin-bottom:28px}
.date-header .firm{font-size:.58rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.date-header .dt{font-size:2.4rem;font-weight:900;letter-spacing:-.02em;line-height:1}

.stat-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;text-align:center}
.stat-card .sc-icon{font-size:.7rem;margin-bottom:8px;display:block;color:var(--text3)}
.stat-card .sc-val{font-size:1.8rem;font-weight:900;color:var(--green);line-height:1.1}
.stat-card .sc-lbl{font-size:.58rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-top:4px}

.dash-grid{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
@media(max-width:800px){.dash-grid{grid-template-columns:1fr}}

.podium-panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px}
.podium-title{font-size:.58rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--text3);text-align:center;margin-bottom:20px}
.pod-card{display:flex;align-items:center;gap:14px;padding:14px;border-radius:12px;margin-bottom:10px;animation:podIn .5s ease backwards}
.pod-card:last-child{margin-bottom:0}
.pod-card.p1{background:linear-gradient(135deg,rgba(212,169,55,.15),rgba(212,169,55,.05));border:1px solid rgba(212,169,55,.25);animation-delay:.1s}
.pod-card.p2{background:rgba(192,199,208,.06);border:1px solid rgba(192,199,208,.12);animation-delay:.2s}
.pod-card.p3{background:rgba(205,127,50,.06);border:1px solid rgba(205,127,50,.12);animation-delay:.3s}
@keyframes podIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.pod-medal{font-size:2rem;flex-shrink:0}
.pod-pos{font-size:1.6rem;font-weight:900;flex-shrink:0;width:36px;text-align:center}
.pod-card.p1 .pod-pos{color:var(--gold)}.pod-card.p2 .pod-pos{color:var(--silver)}.pod-card.p3 .pod-pos{color:var(--bronze)}
.pod-info{flex:1;min-width:0}
.pod-name{font-size:.82rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod-stats{font-size:.68rem;color:var(--text2);margin-top:2px}

.table-panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;overflow:hidden}
.tp-header{display:flex;align-items:center;padding:8px 8px 12px;font-size:.55rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);border-bottom:1px solid var(--border)}
.tp-rank{width:28px}.tp-name{flex:1}.tp-ac{width:56px;text-align:center}.tp-val{width:80px;text-align:right}.tp-bar{width:70px;text-align:right}
.trow{display:flex;align-items:center;padding:8px;border-radius:8px;animation:rowIn .3s ease backwards;transition:background .15s}
.trow:hover{background:rgba(59,130,246,.06)!important}
.trow:nth-child(even){background:rgba(15,29,50,.5)}
.trow.hl{background:rgba(212,169,55,.08)!important;border:1px solid rgba(212,169,55,.15)}
@keyframes rowIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}
.trow .rk{width:28px;font-size:.7rem;font-weight:700;color:var(--text3)}
.trow .nm{flex:1;font-size:.78rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .ac{width:56px;text-align:center;font-weight:800;font-size:.85rem;color:var(--green)}
.trow .vl{width:80px;text-align:right;font-size:.7rem;color:var(--text2)}
.trow .bar{width:70px;padding-left:8px}
.bar-bg{height:6px;background:var(--surface);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--blue2));transition:width .6s ease}

.dash-footer{text-align:center;padding:36px 16px 16px;font-size:.55rem;color:var(--text3);letter-spacing:.1em;text-transform:uppercase}
.dash-footer .brand-ft{font-size:.85rem;font-weight:800;color:var(--text3);letter-spacing:.08em;margin-bottom:4px}

.comp-upload{padding:24px 16px;text-align:center}
.comp-slots{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:24px}
.comp-slot{width:160px;border:1.5px dashed var(--border);border-radius:14px;padding:24px 14px;cursor:pointer;text-align:center;transition:all .2s;background:var(--card)}
.comp-slot:hover{border-color:var(--gold)}
.comp-slot.loaded{border-color:var(--green);border-style:solid}
.comp-slot .slot-icon{font-size:1.6rem;margin-bottom:8px}
.comp-slot .slot-label{font-size:.7rem;font-weight:600;color:var(--text2)}
.comp-slot .slot-date{font-size:.62rem;color:var(--green);margin-top:6px;display:none}
.comp-slot.loaded .slot-date{display:block}
.comp-slot input{display:none}
.btn-gen{padding:14px 36px;border:none;border-radius:12px;font-size:.85rem;font-weight:700;cursor:pointer;font-family:inherit;background:var(--gold);color:#0a1628;transition:all .2s;display:none}
.btn-gen.vis{display:inline-block}
.btn-gen:hover{opacity:.85;transform:translateY(-1px)}
.comp-section{padding:0 16px 16px;overflow-x:auto}
.comp-table{width:100%;border-collapse:separate;border-spacing:0}
.comp-table th{font-size:.56rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);padding:10px 8px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
.comp-table th.num{text-align:right}
.comp-table td{padding:9px 8px;font-size:.75rem;border-bottom:1px solid rgba(30,52,80,.4)}
.comp-table td.num{text-align:right;font-size:.72rem;color:var(--text2)}
.comp-table td.nmcell{font-weight:500}
.comp-table tr:nth-child(odd) td{background:rgba(15,29,50,.35)}
.comp-table tr.hl td{background:rgba(212,169,55,.06)!important}
.trend-up{color:var(--green);font-weight:700;font-size:.68rem}
.trend-down{color:var(--red);font-weight:700;font-size:.68rem}
.trend-same{color:var(--text3);font-size:.68rem}
.comp-personal{padding:24px 16px;text-align:center}
.comp-personal h3{font-size:.9rem;font-weight:700;margin-bottom:16px;color:var(--gold)}
.personal-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:12px;display:flex;justify-content:space-around;text-align:center}
.personal-card .pc-val{font-size:1.5rem;font-weight:800;color:var(--green)}
.personal-card .pc-lbl{font-size:.6rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-top:2px}
.personal-trend{font-size:.8rem;font-weight:700;margin-top:8px}

.toolbar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:none;gap:8px;padding:10px 16px;background:rgba(15,29,50,.95);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:14px;z-index:10}
.toolbar button{padding:10px 20px;border:none;border-radius:10px;font-size:.75rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}
.btn-new{background:var(--card2);color:var(--text2)}
.btn-link{background:var(--blue);color:#fff}
.toolbar button:hover{opacity:.85;transform:translateY(-1px)}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--green);color:#0a1628;padding:12px 24px;border-radius:12px;font-size:.8rem;font-weight:600;z-index:60;transition:transform .4s;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
.admin-only{display:none}
.section-title{font-size:.58rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--text3);text-align:center;margin-bottom:20px}

/* Admin upload overlay */
.upload-overlay{display:none;position:relative;z-index:1;text-align:center;padding:16px;margin-bottom:16px}
.upload-overlay .drop-sm{display:inline-block;padding:10px 24px;border:1px dashed var(--border);border-radius:10px;cursor:pointer;font-size:.72rem;color:var(--text2);transition:all .2s;background:var(--card)}
.upload-overlay .drop-sm:hover{border-color:var(--gold);color:var(--gold)}
.upload-overlay input{display:none}
</style>
</head>
<body>
<div class="bg-layer"></div>

<div class="login-screen" id="loginScreen">
<div class="login-box">
<div class="login-logo">Édimo · Soluções em Cobranças</div>
<input type="text" id="loginUser" placeholder="Nome" autocomplete="off">
<input type="password" id="loginPass" placeholder="Senha" autocomplete="off">
<button class="login-btn" onclick="doLogin()">Entrar</button>
<div class="login-error" id="loginError">Usuário ou senha incorretos</div>
<div class="login-loading" id="loginLoading">Verificando...</div>
</div>
</div>

<div class="nav" id="nav"><div class="nav-inner">
<div class="nav-brand">Édimo</div>
<button class="nav-tab active" onclick="showPage('ranking')" id="tabR">Ranking</button>
<button class="nav-tab" onclick="showPage('comparativo')" id="tabC">Comparativo</button>
<div class="nav-right"><span class="nav-user" id="navUser"></span><button class="nav-logout" onclick="doLogout()">Sair</button></div>
</div></div>

<div class="main">
<div class="page" id="pageRanking">
<div class="loading-msg" id="rankLoading">Carregando ranking...</div>
</div>
<div class="page" id="pageComp">
<div class="date-header"><div class="firm">Édimo Debarba Junior</div><div class="dt">Comparativo</div></div>
<div class="comp-upload admin-only" id="compUpload">
<div class="comp-slots">
<div class="comp-slot" id="slot0" onclick="document.getElementById('cf0').click()"><div class="slot-icon">📁</div><div class="slot-label">Mês 1 (antigo)</div><div class="slot-date" id="sd0"></div><input type="file" id="cf0" accept=".xlsx,.xls" onchange="loadCF(0,this)"></div>
<div class="comp-slot" id="slot1" onclick="document.getElementById('cf1').click()"><div class="slot-icon">📁</div><div class="slot-label">Mês 2</div><div class="slot-date" id="sd1"></div><input type="file" id="cf1" accept=".xlsx,.xls" onchange="loadCF(1,this)"></div>
<div class="comp-slot" id="slot2" onclick="document.getElementById('cf2').click()"><div class="slot-icon">📁</div><div class="slot-label">Mês 3 (atual)</div><div class="slot-date" id="sd2"></div><input type="file" id="cf2" accept=".xlsx,.xls" onchange="loadCF(2,this)"></div>
</div>
<button class="btn-gen" id="btnGen" onclick="genComp()">Gerar Comparativo</button>
</div>
<div id="compR"></div>
</div>
</div>

<div class="toolbar" id="toolbar">
<button class="btn-new admin-only" onclick="loadFromDrive()">↻ Atualizar</button>
<button class="btn-link admin-only" onclick="copyLink()">🔗 Link</button>
</div>
<div class="toast" id="toast"></div>

<script>
const SH='https://docs.google.com/spreadsheets/d/e/2PACX-1vR4kJt-TMldOotLcKYo0d9KnFiQJGqc20Yj0Xfe52Ib9fKJd4bZXCLFXom_jt4tA_LYF2YoPqCL6DJN/pub?output=csv';
const RK='https://docs.google.com/spreadsheets/d/e/2PACX-1vRjHX1-Uu8HaBwa7iT_5XSTNkcp2pbSTKTsVsygCKucMChmcI4hTZkC_pNEsuFNeQ/pub?output=csv';
let cU=null,cRD=null;const cD=[null,null,null];

async function doLogin(){const u=document.getElementById('loginUser').value.trim().toLowerCase(),p=document.getElementById('loginPass').value;if(!u||!p)return;document.getElementById('loginError').style.display='none';document.getElementById('loginLoading').style.display='block';try{const r=await fetch(SH),c=await r.text(),rows=c.split('\n').map(r=>r.split(',').map(c=>c.trim().replace(/^"|"$/g,'')));let f=null;for(let i=1;i<rows.length;i++){if(rows[i].length>=3){const n=rows[i][0].toLowerCase().trim(),s=rows[i][1].trim(),pf=rows[i][2].toLowerCase().trim();if(n===u&&s===p){f={nome:rows[i][0].trim(),perfil:pf};break}}}document.getElementById('loginLoading').style.display='none';if(f){cU=f;sessionStorage.setItem('user',JSON.stringify(f));document.getElementById('loginScreen').style.display='none';setupUI();startApp()}else{document.getElementById('loginError').style.display='block'}}catch(e){document.getElementById('loginLoading').style.display='none';document.getElementById('loginError').textContent='Erro de conexão';document.getElementById('loginError').style.display='block'}}
document.getElementById('loginPass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
function setupUI(){document.getElementById('navUser').textContent=cU.nome;if(isA())document.querySelectorAll('.admin-only').forEach(el=>el.style.display='')}
function doLogout(){sessionStorage.removeItem('user');cU=null;cRD=null;window.location.hash='';window.location.reload()}
window.addEventListener('load',()=>{const s=sessionStorage.getItem('user');if(s){try{cU=JSON.parse(s);document.getElementById('loginScreen').style.display='none';setupUI();startApp()}catch(e){}}});
function isA(){return cU&&cU.perfil==='admin'}

async function startApp(){
  showNav();showPage('ranking');
  // Check hash first (shared link)
  const h=window.location.hash;
  if(h&&h.startsWith('#d=')){try{const j=LZString.decompressFromEncodedURIComponent(h.substring(3));if(j){cRD=JSON.parse(j);renderR(cRD);return}}catch(e){}}
  // Load from Drive
  await loadFromDrive();
}

async function loadFromDrive(){
  document.getElementById('rankLoading').style.display='block';
  try{
    const r=await fetch(RK+'&t='+Date.now());
    const csv=await r.text();
    const rows=csv.split('\n').map(r=>parseCSVRow(r));
    processCSV(rows);
  }catch(e){
    document.getElementById('rankLoading').innerHTML='Erro ao carregar dados. Tente novamente.';
  }
}

function parseCSVRow(row){
  const result=[];let cell='';let inQuote=false;
  for(let i=0;i<row.length;i++){
    const c=row[i];
    if(c==='"'){inQuote=!inQuote}
    else if(c===','&&!inQuote){result.push(cell.trim());cell=''}
    else{cell+=c}
  }
  result.push(cell.trim());
  return result;
}

function processCSV(rows){
  let dt='';
  for(let i=0;i<rows.length;i++){
    const j=rows[i].join(' ');
    const m=j.match(/(\d{2}\/\d{2}\/\d{4})\s*até/);
    if(m){dt=m[1];break}
  }
  let hI=-1;
  for(let i=0;i<rows.length;i++){if(rows[i].some(v=>v==='Operador')){hI=i;break}}
  if(hI===-1){document.getElementById('rankLoading').innerHTML='Formato não reconhecido';return}
  const ops=[];
  for(let i=hI+1;i<rows.length;i++){
    const row=rows[i];if(!row[0])continue;
    const nm=row[0].trim();
    if(nm==='Totais'||nm===''||nm.toLowerCase().includes('suporte.139'))continue;
    const vs=row.slice(1).filter(v=>v!=='').map(v=>parseFloat(v.replace(/\./g,'').replace(',','.'))||0);
    // Last two: total qty, total value
    if(vs.length<2)continue;
    const tv=vs[vs.length-1],tq=Math.round(vs[vs.length-2]);
    if(tq===0&&tv===0)continue;
    ops.push({n:cn(nm),a:tq,v:Math.round(tv*100)/100});
  }
  let ta=0,tv2=0;
  for(let i=hI+1;i<rows.length;i++){
    if(rows[i][0]&&rows[i][0].trim()==='Totais'){
      const vs=rows[i].slice(1).filter(v=>v!=='').map(v=>parseFloat(v.replace(/\./g,'').replace(',','.'))||0);
      if(vs.length>=2){tv2=vs[vs.length-1];ta=Math.round(vs[vs.length-2])}
      break;
    }
  }
  ops.sort((a,b)=>b.a-a.a||b.v-a.v);
  cRD={d:dt,ta,tv:Math.round(tv2*100)/100,ops};
  renderR(cRD);
}

function showNav(){document.getElementById('nav').style.display='block'}
function showPage(p){document.getElementById('tabR').classList.toggle('active',p==='ranking');document.getElementById('tabC').classList.toggle('active',p==='comparativo');document.getElementById('pageRanking').classList.toggle('active',p==='ranking');document.getElementById('pageComp').classList.toggle('active',p==='comparativo');toolbar.style.display=(p==='ranking'&&cRD)?'flex':'none'}

const toolbar=document.getElementById('toolbar');

function renderR(data){
  document.getElementById('rankLoading').style.display='none';
  const{d:date,ta,tv,ops}=data,t3=ops.slice(0,3),mx=Math.max(...ops.map(o=>o.a));
  const uN=cU?cU.nome.toLowerCase():'';
  let h='';
  h+='<div class="date-header"><div class="firm">Édimo Debarba Junior</div><div class="dt">'+date+'</div></div>';
  h+='<div class="stat-cards"><div class="stat-card"><span class="sc-icon">📋</span><div class="sc-val">'+ta+'</div><div class="sc-lbl">Acordos</div></div><div class="stat-card"><span class="sc-icon">💰</span><div class="sc-val">'+fs(tv)+'</div><div class="sc-lbl">Valor Total</div></div><div class="stat-card"><span class="sc-icon">👥</span><div class="sc-val">'+ops.length+'</div><div class="sc-lbl">Operadores</div></div></div>';
  h+='<div class="dash-grid">';
  if(t3.length>=3){h+='<div class="podium-panel"><div class="podium-title">Top 3 do Dia</div>';const md=['🥇','🥈','🥉'],cl=['p1','p2','p3'],po=['1°','2°','3°'];t3.forEach((o,i)=>{h+='<div class="pod-card '+cl[i]+'"><div class="pod-medal">'+md[i]+'</div><div class="pod-pos">'+po[i]+'</div><div class="pod-info"><div class="pod-name">'+o.n+'</div><div class="pod-stats">'+o.a+' acordos · '+fs(o.v)+'</div></div></div>'});h+='</div>'}
  h+='<div class="table-panel"><div class="tp-header"><div class="tp-rank">#</div><div class="tp-name">Operador</div><div class="tp-ac">Acordos</div><div class="tp-val">Valor</div><div class="tp-bar">Progresso</div></div>';
  ops.forEach((o,i)=>{const hl=mU(o.n,uN)?' hl':'';const pct=mx>0?Math.round((o.a/mx)*100):0;h+='<div class="trow'+hl+'" style="animation-delay:'+(i*20)+'ms"><div class="rk">'+(i+1)+'</div><div class="nm">'+o.n+'</div><div class="ac">'+o.a+'</div><div class="vl">'+fm(o.v)+'</div><div class="bar"><div class="bar-bg"><div class="bar-fill" style="width:'+pct+'%"></div></div></div></div>'});
  h+='</div></div>';
  h+='<div class="dash-footer"><div class="brand-ft">ÉDIMO</div>Soluções em Cobranças</div>';
  document.getElementById('pageRanking').innerHTML=h;
  toolbar.style.display='flex';
}

function mU(op,u){if(!u)return false;const a=op.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''),b=u.normalize('NFD').replace(/[\u0300-\u036f]/g,''),ps=b.split(' ').filter(p=>p.length>2);return ps.every(p=>a.includes(p))}

function loadCF(idx,input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{try{const d=new Uint8Array(e.target.result),wb=XLSX.read(d,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});cD[idx]=pC(rows);document.getElementById('slot'+idx).classList.add('loaded');document.getElementById('slot'+idx).querySelector('.slot-icon').textContent='✅';const de=document.getElementById('sd'+idx);de.textContent=cD[idx].period;de.style.display='block';chkR()}catch(err){sT('Erro ao ler')}};r.readAsArrayBuffer(f)}
function pC(rows){let period='';for(let i=0;i<rows.length;i++){if(!rows[i])continue;const j=rows[i].filter(v=>v!=null).join(' '),m=j.match(/(\d{2}\/\d{2}\/\d{4})\s*até\s*(\d{2}\/\d{2}\/\d{4})/);if(m){period=m[1]+' a '+m[2];break}}let hI=-1;for(let i=0;i<rows.length;i++){if(rows[i]&&rows[i].some(v=>v==='Operador')){hI=i;break}}if(hI===-1)return{period,ops:[]};const ops=[];for(let i=hI+1;i<rows.length;i++){const row=rows[i];if(!row||!row[0])continue;const nm=String(row[0]).trim();if(nm==='Totais'||nm===''||nm==='Subtotal'||nm.startsWith('NÃO')||nm.startsWith('*'))continue;if(nm.toLowerCase().includes('suporte'))continue;const qtd=parseInt(row[3])||0;const val=parseFloat(row[4])||0;if(qtd===0&&val===0)continue;ops.push({n:cn(nm),a:qtd,v:Math.round(val*100)/100})}return{period,ops}}
function chkR(){document.getElementById('btnGen').classList.toggle('vis',cD.filter(d=>d!==null).length>=2)}

function genComp(){const ms=cD.filter(d=>d!==null);if(ms.length<2)return;const allN=new Set();ms.forEach(m=>m.ops.forEach(o=>allN.add(o.n)));const od=[];allN.forEach(name=>{const r={name,months:[]};ms.forEach(m=>{const f=m.ops.find(o=>o.n===name);r.months.push(f?{a:f.a,v:f.v}:{a:0,v:0})});od.push(r)});od.sort((a,b)=>b.months[b.months.length-1].v-a.months[a.months.length-1].v);const uN=cU?cU.nome.toLowerCase():'';
if(isA()){let h='<div class="comp-section"><div class="section-title">Acordos Recebidos</div><table class="comp-table"><thead><tr><th>Operador</th>';ms.forEach((m,i)=>{const lb=m.period.split(' a ')[0].substring(3);h+='<th class="num">Qtd</th><th class="num">Valor</th>';if(i>0)h+='<th class="num">Var</th>'});h+='</tr><tr><th></th>';ms.forEach((m,i)=>{const lb=m.period.split(' a ')[0].substring(3);h+='<th class="num" style="font-weight:500;font-size:.48rem;color:var(--text3)">'+lb+'</th><th class="num" style="font-weight:500;font-size:.48rem;color:var(--text3)">'+lb+'</th>';if(i>0)h+='<th></th>'});h+='</tr></thead><tbody>';od.forEach(op=>{const hl=mU(op.name,uN)?' hl':'';h+='<tr class="'+hl+'"><td class="nmcell">'+op.name+'</td>';op.months.forEach((m,i)=>{h+='<td class="num">'+m.a+'</td><td class="num">'+fm(m.v)+'</td>';if(i>0){const prev=op.months[i-1].v,curr=m.v;if(prev===0&&curr===0)h+='<td class="num"><span class="trend-same">-</span></td>';else if(prev===0)h+='<td class="num"><span class="trend-up">NOVO</span></td>';else{const pct=Math.round(((curr-prev)/prev)*100);h+='<td class="num"><span class="'+(pct>0?'trend-up':pct<0?'trend-down':'trend-same')+'">'+(pct>0?'▲'+pct+'%':pct<0?'▼'+Math.abs(pct)+'%':'=0%')+'</span></td>'}}});h+='</tr>'});h+='</tbody></table></div>';document.getElementById('compR').innerHTML=h}
else{const myD=od.find(op=>mU(op.name,uN));let h='<div class="comp-personal">';if(myD){h+='<h3>Seu Desempenho</h3>';myD.months.forEach((m,i)=>{const lb=ms[i].period.split(' a ')[0].substring(3);h+='<div style="font-size:.6rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin:16px 0 8px">'+lb+'</div><div class="personal-card"><div><div class="pc-val">'+m.a+'</div><div class="pc-lbl">Acordos</div></div><div><div class="pc-val">'+fm(m.v)+'</div><div class="pc-lbl">Valor</div></div></div>';if(i>0){const prev=myD.months[i-1].v,curr=m.v;if(prev>0){const pct=Math.round(((curr-prev)/prev)*100);h+='<div class="personal-trend '+(pct>=0?'trend-up':'trend-down')+'">'+(pct>=0?'▲'+pct+'%':'▼'+Math.abs(pct)+'%')+' vs mês anterior</div>'}else if(curr>0){h+='<div class="personal-trend trend-up">Primeiro mês!</div>'}}})}else{h+='<p style="color:var(--text2);font-size:.85rem;margin-top:24px">Seus dados ainda não apareceram nos relatórios.</p>'}h+='</div>';document.getElementById('compR').innerHTML=h}}

function cn(r){if(r.toUpperCase().includes('WEBSERVICE'))return'Robô Edimo';let n=r.replace(/^[\d]+\.?(\d+\.)?/,'');return n.split('.').map(p=>p?p.charAt(0).toUpperCase()+p.slice(1).toLowerCase():'').filter(p=>p).join(' ')}
function fm(v){return'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fs(v){return'R$ '+Math.round(v).toLocaleString('pt-BR')}
function copyLink(){const json=JSON.stringify(cRD),comp=LZString.compressToEncodedURIComponent(json),url=window.location.origin+window.location.pathname+'#d='+comp;navigator.clipboard.writeText(url).then(()=>sT('Link copiado!')).catch(()=>{const t=document.createElement('textarea');t.value=url;document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);sT('Link copiado!')})}
function sT(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
</script>
</body>
</html>
