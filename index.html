<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal | Edimo Debarba Junior</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
:root{--gold:oklch(75% 0.14 85);--gold-glow:oklch(75% 0.14 85/.3);--bg:oklch(14% 0.008 260);--surface:oklch(18% 0.008 260);--surface2:oklch(22% 0.008 260);--surface3:oklch(25% 0.008 260);--text:oklch(92% 0.005 260);--text2:oklch(65% 0.005 260);--text3:oklch(45% 0.005 260);--green:oklch(78% 0.14 155);--red:oklch(70% 0.14 25);--silver:oklch(75% 0.01 260);--bronze:oklch(62% 0.08 55);--border:oklch(22% 0.005 260)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-feature-settings:"tnum"}

/* Nav */
.nav{display:none;position:fixed;top:0;left:0;right:0;background:oklch(12% 0.008 260);border-bottom:1px solid var(--border);z-index:50;padding:0 16px}
.nav-inner{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:8px;height:48px}
.nav-brand{font-size:.65rem;font-weight:700;color:var(--gold);letter-spacing:.1em;text-transform:uppercase;margin-right:auto}
.nav-tab{padding:6px 14px;border:none;border-radius:6px;font-size:.72rem;font-weight:600;cursor:pointer;font-family:inherit;background:transparent;color:var(--text3);transition:all .2s}
.nav-tab.active{background:var(--surface2);color:var(--text)}
.nav-tab:hover{color:var(--text2)}

/* Upload */
.upload-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:32px}
.brand-mark{margin-bottom:48px;text-align:center}
.brand-mark .icon{width:56px;height:56px;border:2px solid var(--gold);border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:1.5rem}
.brand-mark h1{font-size:1rem;font-weight:600;color:var(--gold);letter-spacing:.12em;text-transform:uppercase}
.brand-mark p{font-size:.75rem;color:var(--text3);margin-top:4px;letter-spacing:.04em}
.drop-zone{width:100%;max-width:440px;border:1.5px dashed oklch(30% 0.005 260);border-radius:16px;padding:48px 32px;text-align:center;cursor:pointer;transition:all .25s cubic-bezier(.22,1,.36,1);background:var(--surface)}
.drop-zone:hover,.drop-zone.dragover{border-color:var(--gold);background:oklch(20% 0.01 85);box-shadow:0 0 40px var(--gold-glow)}
.drop-zone h2{font-size:1rem;font-weight:600;margin-bottom:6px}
.drop-zone p{font-size:.78rem;color:var(--text2);margin-bottom:4px}
.drop-zone small{font-size:.68rem;color:var(--text3)}
.drop-zone input{display:none}
.error-msg{color:var(--red);margin-top:16px;font-size:.8rem;display:none}

/* Page container */
.page{display:none;padding:64px 0 80px;max-width:640px;margin:0 auto}
.page.active{display:block}

/* Hero */
.hero{background:linear-gradient(135deg,oklch(20% 0.015 85) 0%,var(--bg) 100%);padding:40px 24px 32px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-50%;left:-20%;width:140%;height:200%;background:radial-gradient(ellipse at center,var(--gold-glow) 0%,transparent 60%);opacity:.3;pointer-events:none}
.hero .firm-name{font-size:.65rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:4px;position:relative}
.hero .report-title{font-size:.85rem;font-weight:400;color:var(--text2);letter-spacing:.04em;text-transform:uppercase;margin-bottom:16px;position:relative}
.hero .report-date{font-size:2rem;font-weight:800;color:var(--text);position:relative;line-height:1.1}
.stats-bar{display:flex;justify-content:center;gap:1px;background:oklch(12% 0.005 260)}
.stat-item{flex:1;text-align:center;padding:20px 16px;background:var(--surface)}
.stat-value{font-size:1.6rem;font-weight:800;color:var(--green);line-height:1.2}
.stat-label{font-size:.65rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-top:4px}

/* Podium */
.podium-section{padding:36px 20px 20px}
.section-title{font-size:.65rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);text-align:center;margin-bottom:24px}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:16px}
.podium-item{display:flex;flex-direction:column;align-items:center;animation:podIn .6s cubic-bezier(.22,1,.36,1) backwards}
.podium-item.first{order:2;animation-delay:.1s}.podium-item.second{order:1;animation-delay:.2s}.podium-item.third{order:3;animation-delay:.3s}
@keyframes podIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.podium-medal{font-size:.65rem;font-weight:800;margin-bottom:6px}
.podium-item.first .podium-medal{color:var(--gold)}.podium-item.second .podium-medal{color:var(--silver)}.podium-item.third .podium-medal{color:var(--bronze)}
.podium-avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;margin-bottom:10px}
.podium-item.first .podium-avatar{width:76px;height:76px;font-size:1.3rem;background:linear-gradient(135deg,oklch(70% 0.12 85),oklch(55% 0.10 85));color:oklch(18% 0.03 85);box-shadow:0 4px 32px var(--gold-glow),0 0 0 3px oklch(65% 0.10 85/.2)}
.podium-item.second .podium-avatar{width:60px;height:60px;font-size:1.1rem;background:oklch(50% 0.005 260);color:oklch(18% 0.005 260)}
.podium-item.third .podium-avatar{width:60px;height:60px;font-size:1.1rem;background:oklch(45% 0.05 55);color:oklch(92% 0.01 55)}
.podium-name{font-size:.72rem;font-weight:600;text-align:center;max-width:100px;line-height:1.3}
.podium-stats{font-size:.65rem;color:var(--text2);margin-top:2px;text-align:center}

/* Table */
.table-section{padding:8px 16px 0}
.table-header{display:flex;align-items:center;padding:12px 12px 8px;font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}
.th-rank{width:28px}.th-name{flex:1;padding-left:48px}.th-acordos{width:50px;text-align:center}.th-valor{width:100px;text-align:right}
.table-row{display:flex;align-items:center;padding:9px 12px;border-radius:8px;animation:rowIn .4s cubic-bezier(.22,1,.36,1) backwards}
.table-row:nth-child(odd){background:oklch(16% 0.005 260)}
@keyframes rowIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
.tr-rank{width:28px;font-size:.75rem;font-weight:700;color:var(--text3)}
.tr-avatar{width:32px;height:32px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:.7rem;color:var(--text2);margin-right:10px;flex-shrink:0}
.tr-name{flex:1;font-size:.82rem;font-weight:500}
.tr-acordos{width:50px;text-align:center;font-weight:800;font-size:.9rem;color:var(--green)}
.tr-valor{width:100px;text-align:right;font-size:.75rem;color:var(--text2)}
.dash-footer{text-align:center;padding:32px 16px 16px;font-size:.6rem;color:var(--text3);letter-spacing:.06em}
.dash-footer .line{width:40px;height:1px;background:oklch(25% 0.005 260);margin:0 auto 12px}

/* Comparativo */
.comp-upload{padding:24px 16px;text-align:center}
.comp-slots{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:24px}
.comp-slot{width:140px;border:1.5px dashed var(--border);border-radius:12px;padding:20px 12px;cursor:pointer;text-align:center;transition:all .2s;background:var(--surface)}
.comp-slot:hover{border-color:var(--gold);background:oklch(20% 0.01 85)}
.comp-slot.loaded{border-color:var(--green);border-style:solid;background:oklch(18% 0.02 155)}
.comp-slot .slot-icon{font-size:1.5rem;margin-bottom:8px}
.comp-slot .slot-label{font-size:.7rem;font-weight:600;color:var(--text2)}
.comp-slot .slot-date{font-size:.65rem;color:var(--green);margin-top:4px;display:none}
.comp-slot.loaded .slot-date{display:block}
.comp-slot input{display:none}
.btn-generate{padding:14px 32px;border:none;border-radius:10px;font-size:.85rem;font-weight:700;cursor:pointer;font-family:inherit;background:var(--gold);color:oklch(15% 0.02 85);transition:all .2s;display:none}
.btn-generate.visible{display:inline-block}
.btn-generate:hover{opacity:.85;transform:translateY(-1px)}

/* Comp table */
.comp-section{padding:16px}
.comp-table{width:100%;border-collapse:separate;border-spacing:0}
.comp-table th{font-size:.6rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);padding:8px 10px;text-align:left;border-bottom:1px solid var(--border)}
.comp-table th.num{text-align:right}
.comp-table td{padding:8px 10px;font-size:.78rem;border-bottom:1px solid oklch(18% 0.005 260)}
.comp-table td.num{text-align:right;font-size:.75rem;color:var(--text2)}
.comp-table td.name-cell{font-weight:500}
.comp-table tr:nth-child(odd) td{background:oklch(16% 0.005 260)}
.trend-up{color:var(--green);font-weight:700;font-size:.7rem}
.trend-down{color:var(--red);font-weight:700;font-size:.7rem}
.trend-same{color:var(--text3);font-size:.7rem}

/* Toolbar */
.toolbar{position:fixed;bottom:0;left:0;right:0;display:none;justify-content:center;gap:10px;padding:16px;background:linear-gradient(to top,var(--bg) 60%,transparent);z-index:10}
.toolbar button{padding:12px 24px;border:none;border-radius:10px;font-size:.8rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}
.btn-new{background:var(--surface2);color:var(--text2)}
.btn-link{background:oklch(65% 0.12 200);color:oklch(15% 0.02 200)}
.btn-print{background:var(--gold);color:oklch(15% 0.02 85)}
.toolbar button:hover{opacity:.85;transform:translateY(-1px)}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--green);color:oklch(15% 0.02 155);padding:12px 24px;border-radius:10px;font-size:.8rem;font-weight:600;z-index:60;transition:transform .4s cubic-bezier(.22,1,.36,1);pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- NAV -->
<div class="nav" id="nav">
  <div class="nav-inner">
    <div class="nav-brand">Edimo</div>
    <button class="nav-tab active" onclick="showPage('ranking')">Ranking</button>
    <button class="nav-tab" onclick="showPage('comparativo')">Comparativo</button>
  </div>
</div>

<!-- UPLOAD SCREEN (ranking diario) -->
<div class="upload-screen" id="uploadScreen">
  <div class="brand-mark">
    <div class="icon">⚖️</div>
    <h1>Edimo Debarba Junior</h1>
    <p>Portal de Desempenho</p>
  </div>
  <div class="drop-zone" id="dropZone">
    <div style="font-size:2.5rem;margin-bottom:16px;opacity:.7">📊</div>
    <h2>Ranking Diário de Acordos</h2>
    <p>Arraste o Excel do Cobmais aqui</p>
    <small>Relatório de Acordos Resumido</small>
    <input type="file" id="fileInput" accept=".xlsx,.xls">
  </div>
  <div class="error-msg" id="errorMsg"></div>
</div>

<!-- RANKING PAGE -->
<div class="page" id="pageRanking"></div>

<!-- COMPARATIVO PAGE -->
<div class="page" id="pageComp">
  <div class="hero">
    <div class="firm-name">Edimo Debarba Junior</div>
    <div class="report-title">Comparativo Mensal</div>
    <div class="report-date">Desempenho</div>
  </div>
  <div class="comp-upload" id="compUpload">
    <div class="comp-slots">
      <div class="comp-slot" id="slot0" onclick="document.getElementById('compFile0').click()">
        <div class="slot-icon">📁</div>
        <div class="slot-label">Mês 1 (mais antigo)</div>
        <div class="slot-date" id="slotDate0"></div>
        <input type="file" id="compFile0" accept=".xlsx,.xls" onchange="loadCompFile(0,this)">
      </div>
      <div class="comp-slot" id="slot1" onclick="document.getElementById('compFile1').click()">
        <div class="slot-icon">📁</div>
        <div class="slot-label">Mês 2</div>
        <div class="slot-date" id="slotDate1"></div>
        <input type="file" id="compFile1" accept=".xlsx,.xls" onchange="loadCompFile(1,this)">
      </div>
      <div class="comp-slot" id="slot2" onclick="document.getElementById('compFile2').click()">
        <div class="slot-icon">📁</div>
        <div class="slot-label">Mês 3 (atual)</div>
        <div class="slot-date" id="slotDate2"></div>
        <input type="file" id="compFile2" accept=".xlsx,.xls" onchange="loadCompFile(2,this)">
      </div>
    </div>
    <button class="btn-generate" id="btnGenerate" onclick="generateComp()">Gerar Comparativo</button>
  </div>
  <div id="compResult"></div>
</div>

<div class="toolbar" id="toolbar">
  <button class="btn-new" onclick="resetAll()">↻ Novo</button>
  <button class="btn-link" onclick="copyLink()">🔗 Copiar Link</button>
  <button class="btn-print" onclick="hideForPrint()">📸 Print</button>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===== GLOBALS ===== */
let currentRankData=null;
const compData=[null,null,null];

/* ===== ON LOAD: check hash ===== */
window.addEventListener('load',()=>{
  const h=window.location.hash;
  if(h&&h.startsWith('#d=')){
    try{
      const json=LZString.decompressFromEncodedURIComponent(h.substring(3));
      if(json){currentRankData=JSON.parse(json);renderRanking(currentRankData);showNav();showPage('ranking')}
    }catch(e){}
  }
});

/* ===== NAV ===== */
function showNav(){document.getElementById('nav').style.display='block'}
function showPage(p){
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(pg=>pg.classList.remove('active'));
  if(p==='ranking'){
    document.querySelectorAll('.nav-tab')[0].classList.add('active');
    document.getElementById('pageRanking').classList.add('active');
    toolbar.style.display='flex';
  } else {
    document.querySelectorAll('.nav-tab')[1].classList.add('active');
    document.getElementById('pageComp').classList.add('active');
    toolbar.style.display='none';
  }
}

/* ===== RANKING UPLOAD ===== */
const dropZone=document.getElementById('dropZone'),fileInput=document.getElementById('fileInput'),uploadScreen=document.getElementById('uploadScreen'),toolbar=document.getElementById('toolbar'),errorMsg=document.getElementById('errorMsg');

dropZone.addEventListener('click',()=>fileInput.click());
dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.classList.add('dragover')});
dropZone.addEventListener('dragleave',()=>dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop',e=>{e.preventDefault();dropZone.classList.remove('dragover');handleFile(e.dataTransfer.files[0])});
fileInput.addEventListener('change',e=>{if(e.target.files[0])handleFile(e.target.files[0])});

function handleFile(f){
  if(!f)return;errorMsg.style.display='none';
  const r=new FileReader();
  r.onload=e=>{try{const d=new Uint8Array(e.target.result),wb=XLSX.read(d,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});processRanking(rows)}catch(err){showErr('Erro: '+err.message)}};
  r.readAsArrayBuffer(f);
}
function showErr(m){errorMsg.textContent=m;errorMsg.style.display='block'}

function processRanking(rows){
  let dt='';
  for(let i=0;i<rows.length;i++){if(!rows[i])continue;const j=rows[i].filter(v=>v!=null).join(' '),m=j.match(/(\d{2}\/\d{2}\/\d{4})\s*até/);if(m){dt=m[1];break}}
  let hI=-1;
  for(let i=0;i<rows.length;i++){if(rows[i]&&rows[i].some(v=>v==='Operador')){hI=i;break}}
  if(hI===-1){showErr('Formato não reconhecido');return}
  const ops=[];
  for(let i=hI+1;i<rows.length;i++){
    const row=rows[i];if(!row||!row[0])continue;
    const nm=String(row[0]).trim();if(nm==='Totais'||nm===''||nm.toLowerCase().includes('suporte.139'))continue;
    const vs=[];for(let j=1;j<row.length;j++){if(row[j]!=null&&row[j]!=='')vs.push(row[j])}
    const tv=parseFloat(vs[vs.length-1])||0,tq=parseInt(vs[vs.length-2])||0;
    if(tq===0&&tv===0)continue;
    ops.push({n:cName(nm),a:tq,v:Math.round(tv*100)/100});
  }
  let ta=0,tv2=0;
  for(let i=hI+1;i<rows.length;i++){if(rows[i]&&String(rows[i][0]).trim()==='Totais'){const v=[];for(let j=1;j<rows[i].length;j++){if(rows[i][j]!=null&&rows[i][j]!=='')v.push(rows[i][j])}tv2=parseFloat(v[v.length-1])||0;ta=parseInt(v[v.length-2])||0;break}}
  ops.sort((a,b)=>b.a-a.a||b.v-a.v);
  currentRankData={d:dt,ta,tv:Math.round(tv2*100)/100,ops};
  const json=JSON.stringify(currentRankData),comp=LZString.compressToEncodedURIComponent(json);
  window.location.hash='d='+comp;
  renderRanking(currentRankData);showNav();showPage('ranking');
}

function renderRanking(data){
  const{d:date,ta,tv,ops}=data,t3=ops.slice(0,3);let h='';
  h+='<div class="hero"><div class="firm-name">Edimo Debarba Junior</div><div class="report-title">Ranking de Acordos</div><div class="report-date">'+date+'</div></div>';
  h+='<div class="stats-bar"><div class="stat-item"><div class="stat-value">'+ta+'</div><div class="stat-label">Acordos</div></div><div class="stat-item"><div class="stat-value">'+fs(tv)+'</div><div class="stat-label">Valor Total</div></div><div class="stat-item"><div class="stat-value">'+ops.length+'</div><div class="stat-label">Operadores</div></div></div>';
  if(t3.length>=3){
    h+='<div class="podium-section"><div class="section-title">Top 3 do Dia</div><div class="podium">';
    [{c:'second',i:1,m:'🥈'},{c:'first',i:0,m:'🥇'},{c:'third',i:2,m:'🥉'}].forEach(p=>{const o=t3[p.i];h+='<div class="podium-item '+p.c+'"><div class="podium-medal">'+p.m+'</div><div class="podium-avatar">'+ini(o.n)+'</div><div class="podium-name">'+o.n+'</div><div class="podium-stats">'+o.a+' acordos · '+fs(o.v)+'</div></div>'});
    h+='</div></div>';
  }
  h+='<div class="table-section"><div class="table-header"><div class="th-rank">#</div><div class="th-name">Operador</div><div class="th-acordos">Qtd</div><div class="th-valor">Valor</div></div>';
  ops.forEach((o,i)=>{h+='<div class="table-row" style="animation-delay:'+(i*30)+'ms"><div class="tr-rank">'+(i+1)+'</div><div class="tr-avatar">'+ini(o.n)+'</div><div class="tr-name">'+o.n+'</div><div class="tr-acordos">'+o.a+'</div><div class="tr-valor">'+fm(o.v)+'</div></div>'});
  h+='</div><div class="dash-footer"><div class="line"></div>Edimo Debarba Junior · Assessoria de Cobrança</div>';
  document.getElementById('pageRanking').innerHTML=h;
  uploadScreen.style.display='none';
  toolbar.style.display='flex';
}

/* ===== COMPARATIVO ===== */
function loadCompFile(idx,input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const d=new Uint8Array(e.target.result),wb=XLSX.read(d,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});
      compData[idx]=parseComp(rows);
      const slot=document.getElementById('slot'+idx);
      slot.classList.add('loaded');
      slot.querySelector('.slot-icon').textContent='✅';
      const dateEl=document.getElementById('slotDate'+idx);
      dateEl.textContent=compData[idx].period;dateEl.style.display='block';
      checkCompReady();
    }catch(err){showToast('Erro ao ler arquivo')}
  };
  r.readAsArrayBuffer(f);
}

function parseComp(rows){
  let period='';
  for(let i=0;i<rows.length;i++){if(!rows[i])continue;const j=rows[i].filter(v=>v!=null).join(' '),m=j.match(/(\d{2}\/\d{2}\/\d{4})\s*até\s*(\d{2}\/\d{2}\/\d{4})/);if(m){period=m[1]+' a '+m[2];break}}
  let hI=-1;
  for(let i=0;i<rows.length;i++){if(rows[i]&&rows[i].some(v=>v==='Operador')){hI=i;break}}
  if(hI===-1)return{period,ops:[]};
  const ops=[];
  for(let i=hI+1;i<rows.length;i++){
    const row=rows[i];if(!row||!row[0])continue;
    const nm=String(row[0]).trim();
    if(nm==='Totais'||nm===''||nm==='Subtotal'||nm.startsWith('NÃO COMISSIONADO')||nm.startsWith('*'))continue;
    if(nm.toLowerCase().includes('suporte.139'))continue;
    // Skip subtotal rows (no name prefix pattern)
    if(nm==='Subtotal')continue;
    // Get Quantidade (col index 3 from header) and Valor (col index 4)
    // Header: Operador, Configuração, % Comissão, Quantidade, Valor, Receita, Comissão
    const qtd=parseInt(row[3])||0;
    const val=parseFloat(row[4])||0;
    if(qtd===0&&val===0)continue;
    ops.push({n:cName(nm),a:qtd,v:Math.round(val*100)/100});
  }
  return{period,ops};
}

function checkCompReady(){
  const loaded=compData.filter(d=>d!==null).length;
  document.getElementById('btnGenerate').classList.toggle('visible',loaded>=2);
}

function generateComp(){
  const months=compData.filter(d=>d!==null);
  if(months.length<2)return;
  // Collect all operator names
  const allNames=new Set();
  months.forEach(m=>m.ops.forEach(o=>allNames.add(o.n)));
  // Build data per operator
  const opData=[];
  allNames.forEach(name=>{
    const row={name,months:[]};
    months.forEach(m=>{
      const found=m.ops.find(o=>o.n===name);
      row.months.push(found?{a:found.a,v:found.v}:{a:0,v:0});
    });
    opData.push(row);
  });
  // Sort by last month value desc
  opData.sort((a,b)=>{const la=a.months[a.months.length-1],lb=b.months[b.months.length-1];return lb.v-la.v});
  // Build table
  let h='<div class="comp-section">';
  h+='<div class="section-title" style="text-align:center;margin:24px 0 16px">Acordos Recebidos por Operador</div>';
  h+='<div style="overflow-x:auto"><table class="comp-table"><thead><tr><th>Operador</th>';
  months.forEach((m,i)=>{
    const label=m.period.split(' a ')[0].substring(3);// MM/YYYY
    h+='<th class="num">Qtd '+label+'</th><th class="num">Valor '+label+'</th>';
    if(i>0)h+='<th class="num">Var</th>';
  });
  h+='</tr></thead><tbody>';
  opData.forEach(op=>{
    h+='<tr><td class="name-cell">'+op.name+'</td>';
    op.months.forEach((m,i)=>{
      h+='<td class="num">'+m.a+'</td><td class="num">'+fm(m.v)+'</td>';
      if(i>0){
        const prev=op.months[i-1].v,curr=m.v;
        if(prev===0&&curr===0)h+='<td class="num"><span class="trend-same">-</span></td>';
        else if(prev===0)h+='<td class="num"><span class="trend-up">NOVO</span></td>';
        else{const pct=Math.round(((curr-prev)/prev)*100);
          if(pct>0)h+='<td class="num"><span class="trend-up">▲ '+pct+'%</span></td>';
          else if(pct<0)h+='<td class="num"><span class="trend-down">▼ '+Math.abs(pct)+'%</span></td>';
          else h+='<td class="num"><span class="trend-same">= 0%</span></td>';
        }
      }
    });
    h+='</tr>';
  });
  h+='</tbody></table></div></div>';
  h+='<div class="dash-footer"><div class="line"></div>Edimo Debarba Junior · Assessoria de Cobrança</div>';
  document.getElementById('compResult').innerHTML=h;
}

/* ===== UTILS ===== */
function cName(r){if(r.toUpperCase().includes('WEBSERVICE'))return'Robô Edimo';let n=r.replace(/^[\d]+\.?(\d+\.)?/,'');return n.split('.').map(p=>p?p.charAt(0).toUpperCase()+p.slice(1).toLowerCase():'').filter(p=>p).join(' ')}
function ini(n){const p=n.split(' ');return p.length===1?p[0].substring(0,2).toUpperCase():(p[0][0]+p[p.length-1][0]).toUpperCase()}
function fm(v){return'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fs(v){return'R$ '+Math.round(v).toLocaleString('pt-BR')}

function copyLink(){
  navigator.clipboard.writeText(window.location.href).then(()=>showToast('Link copiado!')).catch(()=>{const t=document.createElement('textarea');t.value=window.location.href;document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);showToast('Link copiado!')});
}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
function resetAll(){uploadScreen.style.display='flex';document.getElementById('pageRanking').innerHTML='';document.getElementById('pageRanking').classList.remove('active');toolbar.style.display='none';fileInput.value='';window.location.hash='';document.getElementById('nav').style.display='none'}
function hideForPrint(){toolbar.style.display='none';document.getElementById('nav').style.display='none';setTimeout(()=>{if(confirm('Tirou o print? OK pra mostrar os botões.')){toolbar.style.display='flex';document.getElementById('nav').style.display='block'}},400)}
</script>
