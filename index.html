<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
:root{--bg:#060e1e;--bg2:#0a1429;--card:#0d1a30;--card2:#101f38;--border:#152544;--border2:#1a3055;--gold:#d4a937;--gold-glow:rgba(212,169,55,.15);--text:#eaf0fa;--text2:#7e93b0;--text3:#3d5575;--green:#22d872;--green2:#1bcc66;--purple:#a855f7;--red:#f87171;--blue:#2563eb;--blue2:#3b82f6;--blue3:#60a5fa;--blue-glow:rgba(37,99,235,.15);--silver:#b8c4d0;--bronze:#cd7f32;--cyan:#06b6d4}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-feature-settings:"tnum"}
.bg-layer{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 50% 0%,rgba(37,99,235,.08) 0%,transparent 60%),radial-gradient(ellipse at 80% 100%,rgba(37,99,235,.05) 0%,transparent 50%);pointer-events:none}

/* LOGIN */
.login-screen{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:32px}
.login-box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:48px 36px;text-align:center}
.login-logo{font-size:.7rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:36px}
.login-box input{width:100%;padding:14px 16px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-family:inherit;font-size:.85rem;margin-bottom:12px;outline:none;transition:border-color .2s}
.login-box input:focus{border-color:var(--blue2)}
.login-box input::placeholder{color:var(--text3)}
.login-btn{width:100%;padding:14px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;font-family:inherit;font-size:.85rem;font-weight:700;cursor:pointer;margin-top:4px;transition:all .2s}
.login-btn:hover{opacity:.9;transform:translateY(-1px)}
.login-error{color:var(--red);font-size:.75rem;margin-top:12px;display:none}
.login-loading{color:var(--text2);font-size:.75rem;margin-top:12px;display:none}

/* NAV */
.nav{display:none;position:fixed;top:12px;left:50%;transform:translateX(-50%);background:rgba(13,26,48,.96);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:14px;z-index:50;padding:0 6px}
.nav-inner{display:flex;align-items:center;gap:2px;height:46px;padding:0 10px}
.nav-brand{font-size:.7rem;font-weight:800;color:var(--gold);letter-spacing:.1em;text-transform:uppercase;margin-right:12px;display:flex;align-items:center;gap:6px}
.nav-tab{padding:7px 16px;border:none;border-radius:8px;font-size:.7rem;font-weight:600;cursor:pointer;font-family:inherit;background:transparent;color:var(--text3);transition:all .2s;display:flex;align-items:center;gap:5px}
.nav-tab.active{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 2px 12px rgba(37,99,235,.3)}
.nav-tab:hover:not(.active){color:var(--text2)}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.nav-user{font-size:.65rem;color:var(--text2);display:flex;align-items:center;gap:4px}
.nav-logout{padding:5px 10px;border:1px solid var(--border);border-radius:6px;font-size:.58rem;font-weight:600;cursor:pointer;font-family:inherit;background:transparent;color:var(--text3);transition:all .2s;display:flex;align-items:center;gap:3px}
.nav-logout:hover{border-color:var(--red);color:var(--red)}

.main{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:72px 20px 40px}
.page{display:none;position:relative;z-index:1}.page.active{display:block}
.loading-msg{text-align:center;padding:60px 20px;color:var(--text2);font-size:.85rem}

/* HEADER */
.date-header{text-align:center;margin-bottom:24px}
.date-header .firm{font-size:.62rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:6px;display:flex;align-items:center;justify-content:center;gap:6px}
.date-header .dt{font-size:2.2rem;font-weight:900;letter-spacing:-.01em;line-height:1;display:flex;align-items:center;justify-content:center;gap:10px}

/* STAT CARDS */
.stat-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 16px;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;right:0;width:60%;height:100%;opacity:.04;pointer-events:none}
.sc-left{display:flex;flex-direction:column;align-items:center;justify-content:center;width:44px;height:44px;border-radius:10px;flex-shrink:0;font-size:1.1rem}
.sc-left.sc-acordos{background:rgba(34,216,114,.1);border:1px solid rgba(34,216,114,.15)}
.sc-left.sc-valor{background:rgba(168,85,247,.1);border:1px solid rgba(168,85,247,.15)}
.sc-left.sc-ops{background:rgba(6,182,212,.1);border:1px solid rgba(6,182,212,.15)}
.sc-right{flex:1}
.sc-label{font-size:.55rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-bottom:4px}
.sc-val{font-size:1.6rem;font-weight:900;line-height:1.1}
.sc-val.green{color:var(--green)}.sc-val.purple{color:var(--purple)}.sc-val.cyan{color:var(--cyan)}

/* GRID */
.dash-grid{display:grid;grid-template-columns:320px 1fr;gap:14px;align-items:start}
@media(max-width:800px){.dash-grid{grid-template-columns:1fr}}

/* PODIUM */
.podium-panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
.podium-title{font-size:.7rem;font-weight:800;color:var(--text);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.pod-card{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;margin-bottom:8px;animation:podIn .5s ease backwards;position:relative}
.pod-card:last-child{margin-bottom:0}
.pod-card.p1{background:linear-gradient(135deg,rgba(212,169,55,.12),rgba(212,169,55,.04));border:1px solid rgba(212,169,55,.2);animation-delay:.1s}
.pod-card.p2{background:rgba(184,196,208,.05);border:1px solid rgba(184,196,208,.1);animation-delay:.2s}
.pod-card.p3{background:rgba(205,127,50,.05);border:1px solid rgba(205,127,50,.1);animation-delay:.3s}
@keyframes podIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.pod-medal{font-size:1.6rem;flex-shrink:0}
.pod-info{flex:1;min-width:0}
.pod-name{font-size:.78rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod-stats{font-size:.62rem;color:var(--text2);margin-top:2px}
.pod-pos{font-size:1.4rem;font-weight:900;flex-shrink:0}
.pod-card.p1 .pod-pos{color:var(--gold)}.pod-card.p2 .pod-pos{color:var(--silver)}.pod-card.p3 .pod-pos{color:var(--bronze)}

/* TABLE */
.table-panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:0;overflow:hidden}
.tp-header{display:flex;align-items:center;padding:12px 14px;font-size:.55rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);border-bottom:1px solid var(--border);background:var(--card2)}
.tp-rank{width:30px}.tp-name{flex:1;display:flex;align-items:center;gap:4px}.tp-ac{width:70px;text-align:center;display:flex;align-items:center;justify-content:center;gap:3px}.tp-val{width:80px;text-align:right;display:flex;align-items:center;justify-content:flex-end;gap:3px}.tp-bar{width:90px;text-align:center}
.trow{display:flex;align-items:center;padding:9px 14px;animation:rowIn .3s ease backwards;transition:background .15s;border-bottom:1px solid rgba(21,37,68,.5)}
.trow:last-child{border-bottom:none}
.trow:hover{background:rgba(37,99,235,.05)!important}
.trow:nth-child(even){background:rgba(10,20,41,.4)}
.trow.hl{background:rgba(212,169,55,.06)!important}
@keyframes rowIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}
.trow .rk{width:30px;font-size:.7rem;font-weight:700;color:var(--text3)}
.trow .nm{flex:1;font-size:.76rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .ac{width:70px;text-align:center;font-weight:800;font-size:.85rem;color:var(--green)}
.trow .vl{width:80px;text-align:right;font-size:.68rem;color:var(--text2)}
.trow .bar{width:90px;padding-left:10px}
.bar-bg{height:7px;background:rgba(21,37,68,.8);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--blue),var(--blue3));transition:width .6s ease}

.dash-footer{text-align:center;padding:32px 16px 16px;font-size:.55rem;color:var(--text3);letter-spacing:.1em;text-transform:uppercase}
.dash-footer .brand-ft{font-size:.85rem;font-weight:800;color:var(--text3);letter-spacing:.08em;margin-bottom:4px}

/* COMP */
.comp-upload{padding:24px 16px;text-align:center}
.comp-slots{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:24px}
.comp-slot{width:160px;border:1.5px dashed var(--border);border-radius:14px;padding:24px 14px;cursor:pointer;text-align:center;transition:all .2s;background:var(--card)}.comp-slot:hover{border-color:var(--blue2)}.comp-slot.loaded{border-color:var(--green);border-style:solid}
.comp-slot .slot-icon{font-size:1.6rem;margin-bottom:8px}.comp-slot .slot-label{font-size:.7rem;font-weight:600;color:var(--text2)}.comp-slot .slot-date{font-size:.62rem;color:var(--green);margin-top:6px;display:none}.comp-slot.loaded .slot-date{display:block}.comp-slot input{display:none}
.btn-gen{padding:14px 36px;border:none;border-radius:12px;font-size:.85rem;font-weight:700;cursor:pointer;font-family:inherit;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;transition:all .2s;display:none}.btn-gen.vis{display:inline-block}.btn-gen:hover{opacity:.85;transform:translateY(-1px)}
.comp-section{padding:0 16px 16px;overflow-x:auto}.comp-table{width:100%;border-collapse:separate;border-spacing:0}
.comp-table th{font-size:.56rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);padding:10px 8px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}.comp-table th.num{text-align:right}
.comp-table td{padding:9px 8px;font-size:.75rem;border-bottom:1px solid rgba(21,37,68,.4)}.comp-table td.num{text-align:right;font-size:.72rem;color:var(--text2)}.comp-table td.nmcell{font-weight:500}
.comp-table tr:nth-child(odd) td{background:rgba(10,20,41,.3)}.comp-table tr.hl td{background:rgba(212,169,55,.05)!important}
.trend-up{color:var(--green);font-weight:700;font-size:.68rem}.trend-down{color:var(--red);font-weight:700;font-size:.68rem}.trend-same{color:var(--text3);font-size:.68rem}
.comp-personal{padding:24px 16px;text-align:center}.comp-personal h3{font-size:.9rem;font-weight:700;margin-bottom:16px;color:var(--gold)}
.personal-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:12px;display:flex;justify-content:space-around;text-align:center}.personal-card .pc-val{font-size:1.5rem;font-weight:800;color:var(--green)}.personal-card .pc-lbl{font-size:.6rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-top:2px}
.personal-trend{font-size:.8rem;font-weight:700;margin-top:8px}

.toolbar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:none;gap:8px;padding:10px 16px;background:rgba(13,26,48,.96);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:14px;z-index:10}
.toolbar button{padding:10px 20px;border:none;border-radius:10px;font-size:.75rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}.btn-new{background:var(--card2);color:var(--text2)}.btn-link{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff}.toolbar button:hover{opacity:.85;transform:translateY(-1px)}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--green);color:#060e1e;padding:12px 24px;border-radius:12px;font-size:.8rem;font-weight:600;z-index:60;transition:transform .4s;pointer-events:none}.toast.show{transform:translateX(-50%) translateY(0)}
.admin-only{display:none}
.section-title{font-size:.58rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--text3);text-align:center;margin-bottom:20px}
</style>

<script>
const SH='https://docs.google.com/spreadsheets/d/e/2PACX-1vR4kJt-TMldOotLcKYo0d9KnFiQJGqc20Yj0Xfe52Ib9fKJd4bZXCLFXom_jt4tA_LYF2YoPqCL6DJN/pub?output=csv';
const RK='https://docs.google.com/spreadsheets/d/e/2PACX-1vRjHX1-Uu8HaBwa7iT_5XSTNkcp2pbSTKTsVsygCKucMChmcI4hTZkC_pNEsuFNeQ/pub?output=csv';
const CP_M1='https://docs.google.com/spreadsheets/d/e/2PACX-1vRd-WnBwsOyBqVeunc1jH3sTzou9KGZllzJYA1QpKC_wk21Y4Cw9A2KprRbowWDRw/pub?output=csv';
const CP_M2='https://docs.google.com/spreadsheets/d/e/2PACX-1vTgVTpekyWnlnCtyKnOgisBZ9YM8WOOoNGe6XKH2PslfxaI3GIdjt4g_hEtLJtqYQ/pub?output=csv';
const CP_NOW='https://docs.google.com/spreadsheets/d/e/2PACX-1vRrs4woT4Rad3tsqEnkRBkBy4mOvXlP-3s24bIOQ3gaxRgPjfH3Lqw4PgMa1qfo-Q/pub?output=csv';
let cU=null,cRD=null;const cD=[null,null,null];

function parseBR(s){if(!s)return 0;s=s.replace(/"/g,'').trim();if(!s||s==='0')return 0;s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)||0;}

function parseCSV(text){
  const lines=text.split('\n');
  let dt='';
  for(let i=0;i<lines.length;i++){const m=lines[i].match(/(\d{2}\/\d{2}\/\d{4})\s*at/);if(m){dt=m[1];break;}}
  let hI=-1;
  for(let i=0;i<lines.length;i++){if(lines[i].includes(',Operador,')){hI=i;break;}}
  if(hI===-1)return null;
  const ops=[];let ta=0,tv=0;
  for(let i=hI+1;i<lines.length;i++){
    const line=lines[i];if(!line.trim())continue;
    const cells=[];let j=0,cell='',inQ=false;
    while(j<line.length){const c=line[j];if(c==='"')inQ=!inQ;else if(c===','&&!inQ){cells.push(cell);cell=''}else cell+=c;j++;}
    cells.push(cell);
    let name='';for(let k=0;k<cells.length;k++){if(cells[k].trim()){name=cells[k].trim();break;}}
    if(!name)continue;
    if(name.toLowerCase().includes('suporte.139'))continue;
    const allNums=[];
    for(let k=0;k<cells.length;k++){const v=cells[k].trim().replace(/"/g,'');if(v&&v.match(/[\d]/)){const n=parseBR(v);if(!isNaN(n))allNums.push({k,n,v});}}
    if(allNums.length<2)continue;
    const totalVal=allNums[allNums.length-1].n;
    const totalQtd=Math.round(allNums[allNums.length-2].n);
    if(name==='Totais'){ta=totalQtd;tv=totalVal;continue;}
    if(totalQtd===0&&totalVal===0)continue;
    ops.push({n:cn(name),a:totalQtd,v:Math.round(totalVal*100)/100});
  }
  ops.sort((a,b)=>b.a-a.a||b.v-a.v);
  return{d:dt,ta,tv:Math.round(tv*100)/100,ops};
}

async function doLogin(){const u=document.getElementById('loginUser').value.trim().toLowerCase(),p=document.getElementById('loginPass').value;if(!u||!p)return;document.getElementById('loginError').style.display='none';document.getElementById('loginLoading').style.display='block';try{const r=await fetch(SH),c=await r.text(),rows=c.split('\n').map(r=>{const cells=[];let cell='',inQ=false;for(let i=0;i<r.length;i++){const ch=r[i];if(ch==='"')inQ=!inQ;else if(ch===','&&!inQ){cells.push(cell.trim());cell=''}else cell+=ch;}cells.push(cell.trim());return cells;});let f=null;for(let i=1;i<rows.length;i++){if(rows[i].length>=3){const n=rows[i][0].toLowerCase().trim(),s=rows[i][1].trim(),pf=rows[i][2].toLowerCase().trim();if(n===u&&s===p){f={nome:rows[i][0].trim(),perfil:pf};break}}}document.getElementById('loginLoading').style.display='none';if(f){cU=f;sessionStorage.setItem('user',JSON.stringify(f));document.getElementById('loginScreen').style.display='none';setupUI();startApp()}else{document.getElementById('loginError').style.display='block'}}catch(e){document.getElementById('loginLoading').style.display='none';document.getElementById('loginError').textContent='Erro de conexão';document.getElementById('loginError').style.display='block'}}
document.getElementById('loginPass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
function setupUI(){document.getElementById('navUser').innerHTML='👤 '+cU.nome;if(isA())document.querySelectorAll('.admin-only').forEach(el=>el.style.display='')}
function doLogout(){sessionStorage.removeItem('user');cU=null;cRD=null;window.location.hash='';window.location.reload()}
window.addEventListener('load',()=>{const s=sessionStorage.getItem('user');if(s){try{cU=JSON.parse(s);document.getElementById('loginScreen').style.display='none';setupUI();startApp()}catch(e){}}});
function isA(){return cU&&cU.perfil==='admin'}

async function startApp(){showNav();showPage('ranking');const h=window.location.hash;if(h&&h.startsWith('#d=')){try{const j=LZString.decompressFromEncodedURIComponent(h.substring(3));if(j){cRD=JSON.parse(j);renderR(cRD);loadCompDrive();return}}catch(e){}}await loadDrive();loadCompDrive();}

async function loadDrive(){document.getElementById('rankLoading').style.display='block';try{const r=await fetch(RK+'&t='+Date.now());const csv=await r.text();const data=parseCSV(csv);if(data&&data.ops.length>0){cRD=data;renderR(cRD)}else{document.getElementById('rankLoading').innerHTML='Nenhum dado encontrado.'}}catch(e){document.getElementById('rankLoading').innerHTML='Erro ao carregar.'}}

function showNav(){document.getElementById('nav').style.display='block'}
function showPage(p){document.getElementById('tabR').classList.toggle('active',p==='ranking');document.getElementById('tabC').classList.toggle('active',p==='comparativo');document.getElementById('pageRanking').classList.toggle('active',p==='ranking');document.getElementById('pageComp').classList.toggle('active',p==='comparativo');toolbar.style.display=(p==='ranking'&&cRD)?'flex':'none'}
const toolbar=document.getElementById('toolbar');

function renderR(data){
  document.getElementById('rankLoading').style.display='none';
  const{d:date,ta,tv,ops}=data,t3=ops.slice(0,3),mx=Math.max(...ops.map(o=>o.a));
  const uN=cU?cU.nome.toLowerCase():'';
  let h='';
  h+='<div class="date-header"><div class="firm">🏆 ÉDIMO DEBARBA JUNIOR</div><div class="dt">📅 '+(date||'Hoje')+'</div></div>';
  h+='<div class="stat-cards">';
  h+='<div class="stat-card"><div class="sc-left sc-acordos">📋</div><div class="sc-right"><div class="sc-label">Acordos</div><div class="sc-val green">'+ta+'</div></div></div>';
  h+='<div class="stat-card"><div class="sc-left sc-valor">💰</div><div class="sc-right"><div class="sc-label">Valor Total</div><div class="sc-val purple">'+fs(tv)+'</div></div></div>';
  h+='<div class="stat-card"><div class="sc-left sc-ops">👥</div><div class="sc-right"><div class="sc-label">Operadores</div><div class="sc-val cyan">'+ops.length+'</div></div></div>';
  h+='</div>';
  h+='<div class="dash-grid">';
  if(t3.length>=3){
    h+='<div class="podium-panel"><div class="podium-title">🏆 TOP 3 DO DIA</div>';
    const md=['🥇','🥈','🥉'],cl=['p1','p2','p3'],po=['👑 1°','2°','3°'];
    t3.forEach((o,i)=>{h+='<div class="pod-card '+cl[i]+'"><div class="pod-medal">'+md[i]+'</div><div class="pod-info"><div class="pod-name">'+o.n+'</div><div class="pod-stats">'+o.a+' acordos · '+fs(o.v)+'</div></div><div class="pod-pos">'+po[i]+'</div></div>'});
    h+='</div>';
  }
  h+='<div class="table-panel"><div class="tp-header"><div class="tp-rank">#</div><div class="tp-name">👤 Operador</div><div class="tp-ac">🤝 Acordos</div><div class="tp-val">💰 Valor</div><div class="tp-bar">Progresso</div></div>';
  ops.forEach((o,i)=>{const hl=mU(o.n,uN)?' hl':'';const pct=mx>0?Math.round((o.a/mx)*100):0;h+='<div class="trow'+hl+'" style="animation-delay:'+(i*20)+'ms"><div class="rk">'+(i+1)+'</div><div class="nm">'+o.n+'</div><div class="ac">'+o.a+'</div><div class="vl">'+fm(o.v)+'</div><div class="bar"><div class="bar-bg"><div class="bar-fill" style="width:'+pct+'%"></div></div></div></div>'});
  h+='</div></div>';
  h+='<div class="dash-footer"><div class="brand-ft">ÉDIMO</div>Soluções em Cobranças</div>';
  document.getElementById('pageRanking').innerHTML=h;toolbar.style.display='flex';
}

function mU(op,u){if(!u)return false;const a=op.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''),b=u.normalize('NFD').replace(/[\u0300-\u036f]/g,''),ps=b.split(' ').filter(p=>p.length>2);return ps.every(p=>a.includes(p))}

function loadCF(idx,input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{try{const d=new Uint8Array(e.target.result),wb=XLSX.read(d,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});cD[idx]=pC(rows);document.getElementById('slot'+idx).classList.add('loaded');document.getElementById('slot'+idx).querySelector('.slot-icon').textContent='✅';const de=document.getElementById('sd'+idx);de.textContent=cD[idx].period;de.style.display='block';autoComp()}catch(err){sT('Erro ao ler: '+err.message)}};r.readAsArrayBuffer(f)}

function pC(rows){
  let period='';
  for(let i=0;i<Math.min(rows.length,30);i++){
    if(!rows[i])continue;
    const j=rows[i].filter(v=>v!=null).join(' ');
    const m=j.match(/(\d{2}\/\d{2}\/\d{4})\s*at[eé]\s*(\d{2}\/\d{2}\/\d{4})/);
    if(m){period=m[1]+' a '+m[2];break;}
  }
  let hI=-1,cols={};
  for(let i=0;i<rows.length;i++){
    if(!rows[i])continue;
    for(let j=0;j<rows[i].length;j++){
      if(String(rows[i][j]||'').trim()==='Operador'){
        hI=i;
        for(let k=0;k<rows[i].length;k++){
          const hv=String(rows[i][k]||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
          if(hv==='operador')cols.op=k;
          else if(hv.startsWith('configura'))cols.cfg=k;
          else if(hv==='quantidade')cols.qtd=k;
          else if(hv==='valor')cols.val=k;
        }
        break;
      }
    }
    if(hI>=0)break;
  }
  if(hI===-1||cols.op===undefined)return{period,ops:[]};
  const ops=[];
  for(let i=hI+1;i<rows.length;i++){
    const row=rows[i];if(!row)continue;
    const nm=String(row[cols.op]||'').trim();
    const cfg=cols.cfg!==undefined?String(row[cols.cfg]||'').trim():'';
    if(!nm||nm==='Subtotal'||nm.startsWith('NÃO')||nm==='Total'||nm==='Totais'||nm.startsWith('*'))continue;
    if(cfg==='Subtotal')continue;
    if(nm.toLowerCase().includes('suporte'))continue;
    const qtd=cols.qtd!==undefined?(parseInt(row[cols.qtd])||0):0;
    const val=cols.val!==undefined?(parseFloat(row[cols.val])||0):0;
    if(qtd===0&&val===0)continue;
    ops.push({n:cn(nm),cfg:cfg,a:qtd,v:Math.round(val*100)/100});
  }
  ops.sort((a,b)=>b.v-a.v||b.a-a.a);
  return{period,ops};
}

function autoComp(){if(cD.some(d=>d!==null))genComp();}

function csvSplit(line){
  const cells=[];let cell='',inQ=false;
  for(let i=0;i<line.length;i++){const c=line[i];if(c==='"')inQ=!inQ;else if(c===','&&!inQ){cells.push(cell);cell='';}else cell+=c;}
  cells.push(cell);return cells;
}

function parseCompCSV(text){
  const lines=text.split('\n');let period='';
  for(let i=0;i<Math.min(lines.length,30);i++){
    const m=lines[i].match(/(\d{2}\/\d{2}\/\d{4})\s*at/);
    if(m){const m2=lines[i].match(/(\d{2}\/\d{2}\/\d{4})\s*at[^\d]*(\d{2}\/\d{2}\/\d{4})/);period=m2?m2[1]+' a '+m2[2]:m[1];break;}
  }
  let hI=-1,hCells=[];
  for(let i=0;i<lines.length;i++){if(lines[i].includes('Operador')){hCells=csvSplit(lines[i]);if(hCells.join(' ').toLowerCase().match(/quantidade|valor/)){hI=i;break;}}}
  if(hI===-1)return{period,ops:[]};
  const cols={};
  hCells.forEach((h,j)=>{const hv=h.trim().replace(/"/g,'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');if(hv==='operador')cols.op=j;else if(hv.startsWith('configura'))cols.cfg=j;else if(hv==='quantidade')cols.qtd=j;else if(hv==='valor')cols.val=j;});
  if(cols.op===undefined)return{period,ops:[]};
  const ops=[];
  for(let i=hI+1;i<lines.length;i++){
    const line=lines[i].trim();if(!line)continue;
    const cells=csvSplit(line);
    const nm=(cells[cols.op]||'').trim().replace(/^"|"$/g,'');
    if(!nm||nm==='Subtotal'||nm==='Total'||nm==='Totais'||nm.startsWith('NÃO')||nm.startsWith('NAO')||nm.startsWith('*'))continue;
    if(nm.toLowerCase().includes('suporte'))continue;
    const cfg=cols.cfg!==undefined?(cells[cols.cfg]||'').trim().replace(/^"|"$/g,''):'';
    if(cfg==='Subtotal')continue;
    const qtd=cols.qtd!==undefined?(parseInt(parseBR(cells[cols.qtd]))||0):0;
    const val=cols.val!==undefined?parseBR(cells[cols.val]):0;
    if(qtd===0&&val===0)continue;
    ops.push({n:cn(nm),cfg:cfg,a:qtd,v:Math.round(val*100)/100});
  }
  ops.sort((a,b)=>b.v-a.v||b.a-a.a);
  return{period,ops};
}

async function loadCompDrive(){
  try{
    const[r1,r2,r3]=await Promise.all([fetch(CP_M1+'&t='+Date.now()),fetch(CP_M2+'&t='+Date.now()),fetch(CP_NOW+'&t='+Date.now())]);
    const csvs=[await r1.text(),await r2.text(),await r3.text()];
    csvs.forEach((csv,idx)=>{
      const d=parseCompCSV(csv);
      if(d&&d.ops.length>0){
        cD[idx]=d;
        const el=document.getElementById('slot'+idx);
        if(el){el.classList.add('loaded');el.querySelector('.slot-icon').textContent='✅';const de=document.getElementById('sd'+idx);de.textContent=d.period;de.style.display='block';}
      }
    });
    autoComp();
  }catch(e){console.log('Comp Drive error:',e);}
}

function getMeta(cfg){
  if(!cfg)return null;const c=cfg.toLowerCase();
  if(c.includes('novat'))return{min:0,max:8000,label:'Experiência',color:'#25c9ff',cls:'eq-novatos'};
  if(c.includes('10')&&c.includes('14'))return{min:10000,max:14000,label:'10-14k',color:'#68c2ff',cls:'eq-10-14'};
  if(c.includes('14')&&c.includes('18'))return{min:14000,max:18000,label:'14-18k',color:'#a96cff',cls:'eq-14-18'};
  if(c.includes('18')&&c.includes('20'))return{min:18000,max:20000,label:'18-20k',color:'#f5b91f',cls:'eq-18-20'};
  if(c.includes('20')&&(c.includes('mais')||c.includes('+')))return{min:20000,max:20000,label:'20k+',color:'#22e477',cls:'eq-20mais'};
  return{min:0,max:0,label:cfg.replace(/[()]/g,''),color:'#91a9c7',cls:'eq-other'};
}
function eqBadge(cfg){const m=getMeta(cfg);return m?'<span class="eq-badge '+m.cls+'">'+m.label+'</span>':'';}
function metaBarHTML(val,cfg){
  const m=getMeta(cfg);if(!m||m.max===0)return'<span style="color:var(--text3);font-size:.6rem">—</span>';
  const pct=Math.min(Math.round((val/m.max)*100),100),exceeded=val>=m.max;
  const star=exceeded?' <span class="meta-star">⭐</span>':'',barColor=exceeded?'#22e477':m.color;
  let info=fm(val)+' / '+fm(m.max);if(exceeded&&m.cls==='eq-20mais')info=fm(val)+' 🔥';
  return '<div class="meta-bar-wrap"><div class="meta-bar-bg"><div class="meta-bar-fill" style="width:'+pct+'%;background:'+barColor+'"></div></div><span class="meta-pct" style="color:'+barColor+'">'+pct+'%'+star+'</span></div><div class="meta-info">'+info+'</div>';
}
function shortPeriod(p){if(!p)return'';const parts=p.split(' a ');if(parts.length===2){const d1=parts[0].substring(3),d2=parts[1].substring(3);return d1===d2?d1:d1+' a '+d2;}return p;}

function genComp(){
  const ms=cD.filter(d=>d!==null);if(ms.length<1)return;
  const now=ms[ms.length-1],prev=ms.length>=2?ms[ms.length-2]:null,oldest=ms.length>=3?ms[0]:null;
  const uN=cU?cU.nome.toLowerCase():'';
  const nowIdx=ms.length-1;
  const allN=new Map();

  ms.forEach((m,mi)=>m.ops.forEach(o=>{
    if(!allN.has(o.n))allN.set(o.n,{name:o.n,cfg:o.cfg,m:new Array(ms.length).fill(null)});
    const r=allN.get(o.n);r.m[mi]={a:o.a,v:o.v};if(o.cfg)r.cfg=o.cfg;
  }));
  const od=[...allN.values()].sort((a,b)=>(b.m[nowIdx]?b.m[nowIdx].v:0)-(a.m[nowIdx]?a.m[nowIdx].v:0));
  const totA=od.reduce((s,o)=>s+(o.m[nowIdx]?o.m[nowIdx].a:0),0);
  const totV=od.reduce((s,o)=>s+(o.m[nowIdx]?o.m[nowIdx].v:0),0);
  const active=od.filter(o=>o.m[nowIdx]&&o.m[nowIdx].a>0).length;
  const periodText=ms.map(m=>shortPeriod(m.period)).join('  vs  ');

  function badge(cfg){
    const m=getMeta(cfg);
    if(!m)return '';
    const cls=m.cls&&m.cls.includes('purple')?'purple':m.cls&&m.cls.includes('gold')?'gold':m.cls&&m.cls.includes('blue')?'blue':'green';
    return '<span class="eq-badge-v2 '+cls+'">'+m.label+'</span>';
  }
  function pctChange(a,b){
    if(!b)return a?'NOVO':'—';
    const p=Math.round(((a-b)/b)*100);
    return p>0?'<span class="trend-pill up">▲ +'+p+'%</span>':p<0?'<span class="trend-pill down">▼ '+Math.abs(p)+'%</span>':'<span class="trend-pill same">= 0%</span>';
  }
  function metaMini(o){
    const meta=getMeta(o.cfg),v=o.m[nowIdx]?o.m[nowIdx].v:0;
    if(!meta||!meta.max)return '<span class="meta-text">—</span>';
    const p=Math.min(Math.round(v/meta.max*100),100);
    return '<div class="meta-mini"><div class="meta-line"><div class="meta-fill" style="width:'+p+'%"></div></div><div class="meta-text">'+p+'% · '+fm(v)+' / '+fm(meta.max)+'</div></div>';
  }

  let h='<div class="comp-v2">';
  h+='<aside class="comp-side">';
  h+='<div class="cs-brand"><div class="cs-crown">👑</div><div><strong>ÉDIMO</strong><small>SOLUÇÕES EM COBRANÇAS</small></div></div>';
  h+='<div class="cs-date"><div class="mini">Mês atual</div><div class="big">'+shortPeriod(now.period)+'</div><div class="day">Acompanhamento de desempenho</div></div>';
  h+='<div class="cs-nav"><button onclick="showPage(\'ranking\')"><span class="ico">🏠</span>Visão Geral</button><button onclick="showPage(\'ranking\')"><span class="ico">🏆</span>Ranking</button><button class="active"><span class="ico">📊</span>Comparativo</button><button onclick="doLogout()"><span class="ico">🚪</span>Sair</button></div>';
  h+='<div class="cs-motto"><div class="target">🎯</div><strong>Juntos batemos<br>mais metas!</strong><span>Foco no próximo acordo.</span></div>';
  h+='</aside>';

  h+='<main class="comp-content">';
  h+='<div class="comp-top"><div class="comp-title-wrap"><div class="comp-title-icon">📈</div><div><div class="comp-title">Comparativo de Acordos</div><div class="comp-sub">Acompanhe o desempenho de cada operador nos últimos 3 meses.</div></div></div>';
  h+='<input id="compSearch" class="comp-search" placeholder="🔎  Buscar operador..." oninput="filterCompRows(this.value)"></div>';

  h+='<div class="comp-stats">';
  h+='<div class="comp-kpi"><div class="ki">🤝</div><div><div class="kl">Total de acordos (atual)</div><div class="kv">'+totA+'</div></div></div>';
  h+='<div class="comp-kpi"><div class="ki">💰</div><div><div class="kl">Valor total (atual)</div><div class="kv">'+fm(totV)+'</div></div></div>';
  h+='<div class="comp-kpi"><div class="ki">👥</div><div><div class="kl">Operadores ativos</div><div class="kv">'+active+'</div></div></div>';
  h+='</div>';

  h+='<div class="comp-tools"><div class="comp-view"><button class="active" onclick="setCompView(\'all\',this)">Qtd + Valor</button><button onclick="setCompView(\'qtd\',this)">Acordos</button><button onclick="setCompView(\'val\',this)">Valor</button></div>';
  h+='<div class="comp-months"><button class="old">'+(oldest?'📅 Mês 1 · '+shortPeriod(oldest.period):'Mês 1')+'</button><button class="prev">'+(prev?'📅 Mês 2 · '+shortPeriod(prev.period):'Mês 2')+'</button><button class="curr">📅 Mês Atual · '+shortPeriod(now.period)+'</button></div></div>';

  h+='<div class="comp-table-wrap"><table class="comp-table-v2" id="compTable"><thead><tr>';
  h+='<th class="rank">#</th><th class="operator">Operador</th><th class="eq">Equipe</th>';
  ms.forEach((m,mi)=>{const cls=mi===nowIdx?'curr':mi===nowIdx-1?'prev':'old';h+='<th colspan="2" class="month '+cls+'">'+(mi===nowIdx?'MÊS ATUAL':mi===nowIdx-1?'MÊS 2':'MÊS 1')+'<br><small>'+shortPeriod(m.period)+'</small></th>';});
  h+='<th class="meta-mini">Meta atual</th>';
  if(prev)h+='<th class="trend">Variação<br><small>Mês 2 → Atual</small></th>';
  h+='</tr><tr><th></th><th></th><th></th>';
  ms.forEach((m,mi)=>{const cls=mi===nowIdx?'curr-col':'';h+='<th class="num '+cls+'">Acordos</th><th class="num value '+cls+'">Valor</th>';});
  h+='<th></th>';if(prev)h+='<th></th>';h+='</tr></thead><tbody>';

  od.forEach((op,i)=>{
    const hl=mU(op.name,uN)?' my-row':'';
    h+='<tr class="comp-row'+hl+'" data-name="'+op.name.toLowerCase()+'">';
    h+='<td class="rank">'+(i+1)+'</td><td class="operator">'+(i<3?['🥇','🥈','🥉'][i]+' ':'')+op.name+'</td><td class="eq">'+badge(op.cfg)+'</td>';
    ms.forEach((m,mi)=>{
      const d=op.m[mi],cur=mi===nowIdx;
      if(d)h+='<td class="num '+(cur?'curr-col ':'')+'col-qtd">'+d.a+'</td><td class="num value '+(cur?'curr-col ':'')+'col-val">'+fm(d.v)+'</td>';
      else h+='<td class="num col-qtd">-</td><td class="num value col-val">-</td>';
    });
    h+='<td>'+metaMini(op)+'</td>';
    if(prev){
      const pv=op.m[nowIdx-1]?op.m[nowIdx-1].v:0,cv=op.m[nowIdx]?op.m[nowIdx].v:0;
      h+='<td class="trend">'+pctChange(cv,pv)+'</td>';
    }
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  h+='<div class="comp-footer"><span>Mostrando '+od.length+' de '+od.length+' operadores · '+periodText+'</span><div class="pages"><button>‹</button><button class="active">1</button><button>›</button></div></div>';
  h+='</main></div>';

  document.getElementById('compR').innerHTML=h;
}

function filterCompRows(q){
  q=(q||'').toLowerCase().trim();
  document.querySelectorAll('#compTable .comp-row').forEach(r=>r.style.display=(!q||r.dataset.name.includes(q))?'':'none');
}
function setCompView(mode,btn){
  document.querySelectorAll('.comp-view button').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  const t=document.getElementById('compTable');if(!t)return;
  t.classList.remove('view-qtd','view-val');
  if(mode==='qtd')t.classList.add('view-qtd');
  if(mode==='val')t.classList.add('view-val');
}

function cn(r){if(r.toUpperCase().includes('WEBSERVICE'))return'Robô Edimo';let n=r.replace(/^[\d]+\.?(\d+\.)?/,'');return n.split('.').map(p=>p?p.charAt(0).toUpperCase()+p.slice(1).toLowerCase():'').filter(p=>p).join(' ')}
function fm(v){return'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fs(v){return'R$ '+Math.round(v).toLocaleString('pt-BR')}
function copyLink(){const json=JSON.stringify(cRD),comp=LZString.compressToEncodedURIComponent(json),url=window.location.origin+window.location.pathname+'#d='+comp;navigator.clipboard.writeText(url).then(()=>sT('Link copiado!')).catch(()=>{const t=document.createElement('textarea');t.value=url;document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);sT('Link copiado!')})}
function sT(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
</script>
</body>
</html>
