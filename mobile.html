<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Édimo Portal</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f2440">
<link rel="apple-touch-icon" href="logo192.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:linear-gradient(180deg,#eef2f7,#f5f7fa);color:#1a1f36;min-height:100vh;-webkit-font-smoothing:antialiased}
.login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-box{width:100%;max-width:360px;background:#fff;border-radius:16px;padding:40px 28px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.login-logo{font-size:.65rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#d4a937;margin-bottom:28px}
.login-box input{width:100%;padding:13px 14px;border:1px solid #e5e7eb;border-radius:10px;background:#f9fafb;font-family:inherit;font-size:.82rem;color:#1a1f36;margin-bottom:10px;outline:none}
.login-box input:focus{border-color:#2563eb}
.login-box input::placeholder{color:#9ca3af}
.login-btn{width:100%;padding:13px;border:none;border-radius:10px;background:#2563eb;color:#fff;font-family:inherit;font-size:.82rem;font-weight:700;cursor:pointer}
.login-err{color:#ef4444;font-size:.7rem;margin-top:10px;display:none}
.login-load{color:#9ca3af;font-size:.7rem;margin-top:10px;display:none}
.app{display:none;min-height:100vh;padding-bottom:68px}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:max(14px,env(safe-area-inset-top,14px)) 16px 10px;background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:10}
.hdr-title{font-size:1.2rem;font-weight:800}.hdr-date{font-size:.65rem;color:#9ca3af;margin-top:1px}
.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e7eb;display:flex;justify-content:space-around;padding:6px 0 max(6px,env(safe-area-inset-bottom));z-index:50}
.bar-btn{display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:none;color:#9ca3af;font-size:.52rem;font-weight:600;font-family:inherit;cursor:pointer;padding:4px 12px;position:relative;transition:color .15s}
.bar-btn.on{color:#1a1f36}

.bar-btn svg{width:22px;height:22px}
.pg{display:none;padding:0 14px 16px}.pg.on{display:block}
.hero{background:linear-gradient(135deg,#3a4557,#2d3748);border-radius:18px;padding:22px 18px;color:#fff;display:flex;align-items:center;gap:14px;margin:12px 0;position:relative}
.hero-trophy{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0}
.hero-body{flex:1}
.hero-lbl{font-size:.65rem;font-weight:600;opacity:.8}
.hero-val{font-size:2rem;font-weight:900;margin:4px 0 2px}
.hero-sub{font-size:.58rem;opacity:.5}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.st{background:#fff;border-radius:12px;padding:14px;border:1px solid #e5e7eb}
.st-icon{font-size:1.1rem;margin-bottom:5px}.st-lbl{font-size:.5rem;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.06em}
.st-val{font-size:1.25rem;font-weight:800;margin-top:2px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px}
.sec-t{font-size:.9rem;font-weight:800}.sec-link{font-size:.62rem;color:#2563eb;font-weight:600}
.pod{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;border:1px solid #e5e7eb}
.pod:first-child{border-color:rgba(212,169,55,.25);background:linear-gradient(135deg,rgba(212,169,55,.04),#fff)}
.pod-medal{font-size:1.5rem;flex-shrink:0}.pod-info{flex:1;min-width:0}
.pod-nm{font-size:.8rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod-st{font-size:.6rem;color:#9ca3af;margin-top:2px}
.pod-pos{font-size:1.05rem;font-weight:900;color:#9ca3af}
.pod:first-child .pod-pos{color:#d4a937}
.srch{width:100%;padding:10px 14px;margin:12px 0;border:1px solid #e5e7eb;border-radius:10px;background:#fff;font-family:inherit;font-size:.8rem;color:#1a1f36;outline:none}
.srch:focus{border-color:#2563eb}
.rw{display:flex;align-items:center;gap:10px;padding:12px;background:#fff;border-radius:12px;margin-bottom:6px;border:1px solid #e5e7eb}
.rw.miss{opacity:.4}
.rw-rk{font-size:.7rem;font-weight:700;color:#9ca3af;width:20px;text-align:center}
.rw-av{width:34px;height:34px;border-radius:50%;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:#6b7280;flex-shrink:0}
.rw-info{flex:1;min-width:0}.rw-nm{font-size:.76rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw-sub{font-size:.55rem;color:#9ca3af;margin-top:1px}
.rw-val{text-align:right}.rw-a{font-size:.82rem;font-weight:800}.rw-v{font-size:.55rem;color:#9ca3af}
.turno{font-size:.42rem;font-weight:700;padding:2px 5px;border-radius:4px;margin-left:3px;vertical-align:middle}
.t-m{color:#16a34a;background:rgba(22,163,74,.08)}.t-t{color:#f59e0b;background:rgba(245,158,11,.08)}.t-n{color:#8b5cf6;background:rgba(139,92,246,.08)}
.cc-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
.cc{background:#fff;border-radius:12px;padding:12px;border:1px solid #e5e7eb;text-align:center}
.cc-lbl{font-size:.48rem;font-weight:600;color:#9ca3af;text-transform:uppercase;margin-bottom:4px}
.cc-val{font-size:1rem;font-weight:800}.cc-pct{font-size:.6rem;font-weight:700;color:#16a34a;margin-top:2px}.cc-pct.neg{color:#ef4444}
.card{background:#fff;border-radius:14px;padding:16px;border:1px solid #e5e7eb;margin:12px 0}
.card-t{font-size:.75rem;font-weight:700;margin-bottom:10px}
.chart-bars{display:flex;justify-content:space-around;align-items:flex-end;height:120px;gap:8px}
.chart-col{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.chart-bar{width:100%;border-radius:6px 6px 0 0;min-height:4px}
.chart-lbl{font-size:.5rem;color:#9ca3af;font-weight:600}.chart-v{font-size:.6rem;font-weight:700}.chart-a{font-size:.5rem;color:#9ca3af}
.var-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.var-pct{font-size:1rem;font-weight:800;color:#16a34a;text-align:center}.var-pct.neg{color:#ef4444}
.var-lbl{font-size:.48rem;color:#9ca3af;text-align:center;margin-top:2px}
.rew-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
.rew{background:#fff;border-radius:10px;padding:10px 8px;border:1px solid #e5e7eb;text-align:center}
.rew.hl{border-color:#d4a937;border-width:2px}.rew-val{font-size:.82rem;font-weight:800}.rew-lbl{font-size:.45rem;color:#9ca3af;margin-top:2px}
.ben-item{display:flex;align-items:center;gap:12px;padding:14px;background:#fff;border-radius:12px;border:1px solid #e5e7eb;margin-bottom:6px}
.ben-icon{width:36px;height:36px;border-radius:10px;background:#f0f2f5;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}
.ben-nm{font-size:.75rem;font-weight:700}.ben-desc{font-size:.58rem;color:#9ca3af}
.tre-item{display:flex;align-items:center;gap:12px;padding:14px;background:#fff;border-radius:12px;border:1px solid #e5e7eb;margin-bottom:6px}
.tre-prog{height:6px;background:#e5e7eb;border-radius:4px;overflow:hidden;margin-top:6px;width:100%}
.tre-prog-fill{height:100%;background:#16a34a;border-radius:4px}
.msg{margin:12px 0;padding:14px;border-radius:12px;font-size:.72rem;font-weight:600;display:flex;align-items:center;gap:8px;background:rgba(37,99,235,.05);color:#2563eb;border:1px solid rgba(37,99,235,.12)}
.menu-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;display:none}.menu-bg.on{display:block}
.menu-sheet{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:20px 20px 0 0;padding:12px 16px max(24px,env(safe-area-inset-bottom));z-index:61;transform:translateY(100%);transition:transform .25s}
.menu-bg.on .menu-sheet{transform:translateY(0)}
.menu-h{width:40px;height:4px;background:#d1d5db;border-radius:4px;margin:0 auto 16px}
.menu-item{display:flex;align-items:center;gap:12px;width:100%;padding:14px 12px;border:none;background:none;font-size:.82rem;font-weight:600;color:#1a1f36;font-family:inherit;cursor:pointer;border-radius:10px;text-align:left}
.menu-item:active{background:#f3f4f6}
.menu-item.out{color:#ef4444;margin-top:8px;border-top:1px solid #e5e7eb;padding-top:14px;border-radius:0}

.top3-card{display:flex;align-items:center;gap:16px;padding:18px;background:#fff;border-radius:18px;margin-bottom:12px;border:1px solid #e5e7eb;min-height:82px}
.top3-left{position:relative;flex-shrink:0;width:54px;height:54px}
.top3-medal{position:absolute;bottom:-4px;left:-6px;font-size:1.3rem;z-index:2;filter:drop-shadow(0 1px 2px rgba(0,0,0,.15))}
.top3-av{width:54px;height:54px;border-radius:50%;background:#d0d0d0;display:flex;align-items:center;justify-content:center;font-size:1.15rem;font-weight:800;color:#fff;border:3px solid #d0d0d0}
.top3-info{flex:1;min-width:0}
.top3-nm{font-size:.95rem;font-weight:700;color:#1a1f36}
.top3-st{font-size:.68rem;color:#9ca3af;margin-top:3px}
.top3-pos{font-size:1.5rem;font-weight:900;flex-shrink:0}

.duo-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 6px}
.duo{background:#fff;border-radius:16px;padding:18px 16px;border:1px solid #e5e7eb;display:flex;align-items:center;gap:12px}
.duo-icon{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
.duo-lbl{font-size:.65rem;font-weight:700;color:#1a1f36}
.duo-val{font-size:1.7rem;font-weight:900;color:#1a1f36;margin-top:1px;display:flex;align-items:center;gap:6px}
.duo-pct{font-size:.55rem;font-weight:700;color:#16a34a}

/* Acordos table */
.tbl-hdr{display:flex;align-items:center;padding:10px 8px;border-bottom:2px solid #e5e7eb;margin-top:8px}
.tbl-h-rk{width:24px;font-size:.5rem;font-weight:700;color:#9ca3af}
.tbl-h-nm{flex:1;font-size:.5rem;font-weight:700;color:#9ca3af;padding-left:40px}
.tbl-h-ac{width:60px;text-align:center;font-size:.5rem;font-weight:700;color:#9ca3af}
.tbl-h-vl{width:80px;text-align:right;font-size:.5rem;font-weight:700;color:#9ca3af}
.tbl-h-t{width:28px}
.tbl-row{display:flex;align-items:center;padding:12px 8px;border-bottom:1px solid #f0f2f5}
.tbl-rk{width:24px;font-size:.72rem;font-weight:600;color:#9ca3af;text-align:center}
.tbl-av{width:32px;height:32px;border-radius:50%;background:#d0d5dd;display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700;color:#fff;margin:0 8px;flex-shrink:0}
.tbl-nm{flex:1;font-size:.78rem;font-weight:600;color:#1a1f36;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl-ac{width:60px;text-align:center;font-size:.82rem;font-weight:800;color:#1a1f36}
.tbl-vl{width:80px;text-align:right;font-size:.65rem;color:#6b7280}
.tbl-turno{width:28px;text-align:center;font-size:.5rem;font-weight:700;padding:3px 0;border-radius:6px}
.tbl-turno.t-m{color:#16a34a;background:rgba(22,163,74,.1)}
.tbl-turno.t-t{color:#f59e0b;background:rgba(245,158,11,.1)}
.tbl-turno.t-n{color:#8b5cf6;background:rgba(139,92,246,.1)}
.ac-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ac-left{display:flex;align-items:center;gap:12px}
.ham{width:22px;display:flex;flex-direction:column;gap:4px}.ham i{display:block;height:2px;background:#1a1f36;border-radius:2px}
.hoje{display:flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid #e5e7eb;border-radius:10px;background:#fff;font-size:.72rem;font-weight:600;color:#1a1f36}
.filters{display:flex;background:#eef0f3;border-radius:12px;padding:4px;margin:4px 0 12px}
.flt{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:9px;font-family:inherit;font-size:.74rem;font-weight:600;color:#6b7280;cursor:pointer}
.flt.on{background:#2d3748;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.tbl-card{background:#fff;border-radius:16px;box-shadow:0 1px 4px rgba(0,0,0,.06);overflow:hidden}
.tbl-card .tbl-hdr{margin-top:0;padding:12px 12px;border-bottom:1px solid #eef0f3}
.tbl-card .tbl-row{padding:11px 12px}
.tbl-card .tbl-row:last-child{border-bottom:0}
.tbl-ch{width:16px;text-align:right;color:#c0c5cf;font-size:.9rem;margin-left:4px}
.tbl-h-ch{width:20px}
.tbl-turno{margin-left:6px}
.ver-todos{display:flex;align-items:center;justify-content:center;gap:6px;padding:14px;border-top:1px solid #eef0f3;font-size:.76rem;font-weight:600;color:#2d3748;background:#fff;width:100%;border-left:0;border-right:0;border-bottom:0;font-family:inherit}

/* v26 acordos igual mockup */
#pgAcordos .hdr{border-bottom:0;background:#f7f9fc;padding-bottom:6px}
#pgAcordos .hdr-title{font-size:1.15rem;font-weight:800;color:#1a1f36}
#pgAcordos .hdr-date{font-size:.72rem;color:#4b5563;margin-top:3px}
.ham{width:22px;gap:5px}.ham i{height:2.5px;background:#1e293b}
.hoje{padding:8px 12px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);font-size:.78rem}
.hoje:after{content:"\2304";margin-left:2px;font-size:.7rem;position:relative;top:-3px}
#pgAcordos .srch{background:#eef2f7;border:1px solid #e3e8ef;border-radius:14px;padding:11px 14px;margin:8px 0 10px;font-size:.8rem}
.filters{background:#eef2f7;border:1px solid #e3e8ef;border-radius:16px;padding:3px}
.flt{padding:10px 4px;border-radius:14px;font-size:.8rem;font-weight:500;color:#374151;position:relative}
.flt+.flt:not(.on):before{content:"";position:absolute;left:0;top:25%;height:50%;width:1px;background:#d6dce5}
.flt.on{background:linear-gradient(180deg,#1e4e7e,#0f3557);color:#fff;font-weight:700;box-shadow:0 3px 8px rgba(15,53,87,.35)}
.flt.on+.flt:before{display:none}
.tbl-card{border:1px solid #e3e8ef;border-radius:16px;box-shadow:0 2px 8px rgba(15,23,42,.05)}
.tbl-card .tbl-hdr{background:#f3f6fa;padding:12px 10px}
.tbl-card .tbl-h-rk,.tbl-card .tbl-h-nm,.tbl-card .tbl-h-ac,.tbl-card .tbl-h-vl{font-size:.62rem;font-weight:600;color:#374151;letter-spacing:.02em}
.tbl-card .tbl-h-rk{width:20px}
.tbl-card .tbl-h-nm{padding-left:0;margin-left:0}
.tbl-card .tbl-h-ac{width:62px}
.tbl-card .tbl-h-vl{width:96px;text-align:left;padding-left:8px}
.tbl-card .tbl-h-t{width:30px}
.tbl-card .tbl-row{padding:9px 10px;border-bottom:1px solid #eef1f5}
.tbl-card .tbl-row:nth-child(odd){background:#fbfcfe}
.tbl-card .tbl-rk{width:20px;text-align:left;font-size:.74rem;font-weight:500;color:#1f2937}
.tbl-card .tbl-av{width:30px;height:30px;margin:0 10px 0 4px;font-size:.72rem;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.tbl-card .tbl-nm{font-size:.78rem;font-weight:500;color:#1f2937}
.tbl-card .tbl-ac{width:62px;font-size:.8rem;font-weight:700;color:#1f2937}
.tbl-card .tbl-vl{width:96px;text-align:left;padding-left:8px;font-size:.76rem;color:#1f2937;white-space:nowrap}
.tbl-card .tbl-turno{width:24px;height:24px;line-height:18px;margin-left:6px;font-size:.7rem;font-weight:700;border-radius:6px}
.tbl-card .tbl-turno.t-m{color:#15803d;background:#dcfce7;border:1px solid #bbf7d0}
.tbl-card .tbl-turno.t-t{color:#b45309;background:#fef3c7;border:1px solid #fde68a}
.tbl-card .tbl-turno.t-n{color:#7e22ce;background:#f3e8ff;border:1px solid #e9d5ff}
.tbl-ch{width:18px;color:#374151;font-size:1.05rem}
.tbl-h-ch{width:18px}
.ver-todos{margin:10px;width:calc(100% - 20px);border:0;border-radius:12px;background:#eef2f7;font-size:.72rem;color:#1f2937;padding:11px}
.vtag{text-align:center;font-size:.55rem;color:#c0c5cf;margin-top:8px}

/* v28 comparativo */
#pgComp .hdr{border-bottom:0;background:#f7f9fc;padding-bottom:6px}
.hdr-date{color:#4b5563}
.cp-wrap{padding:6px 14px 20px}
.cp-sec{display:flex;align-items:center;gap:8px;font-size:.85rem;font-weight:600;color:#1f2937;margin:8px 2px 12px}
.cp-ic{font-size:.95rem}
.kp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kp{background:#fff;border:1px solid #e3e8ef;border-radius:14px;padding:14px;box-shadow:0 1px 4px rgba(15,23,42,.04)}
.kp-lbl{font-size:.75rem;font-weight:600;color:#1f2937}
.kp-val{font-size:1.15rem;font-weight:800;color:#1a1f36;margin:6px 0 10px}
.kp-pct{font-size:.75rem;font-weight:600;color:#16a34a}.kp-pct.neg{color:#ef4444}
.kp-ic{font-size:.7rem}
.cp-card{background:#fff;border:1px solid #e3e8ef;border-radius:16px;padding:16px 14px;margin-bottom:14px;box-shadow:0 1px 4px rgba(15,23,42,.04)}
.cp-card-t{display:flex;align-items:center;gap:8px;font-size:.8rem;font-weight:600;color:#1f2937}
.cp-leg{display:flex;justify-content:flex-end;gap:14px;font-size:.66rem;color:#4b5563;margin:14px 0 10px}
.cp-leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.cp-bars{display:flex;align-items:flex-end;height:100px;border-bottom:1px solid #e5e7eb;padding:0 4px}
.cp-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center}
.cp-bar{width:64%;border-radius:6px 6px 0 0;background:linear-gradient(180deg,#d1d5db 0,#d1d5db 14%,#8e949c 15%,#8a9099 100%)}
.cp-bar.cur{background:linear-gradient(180deg,#60a5fa 0,#60a5fa 14%,#3b82f6 15%,#2563eb 100%)}
.cp-info{display:flex;padding-top:10px}
.cp-mes{font-size:.66rem;color:#4b5563}.cp-mes.cur{color:#2563eb;font-weight:700}
.cp-v{font-size:.8rem;font-weight:700;color:#1a1f36;margin-top:6px}
.cp-a{font-size:.66rem;color:#374151;margin-top:4px}
.cp-var{background:#f3f6fa}
.vr-grid{display:grid;grid-template-columns:1fr 1fr;margin-top:14px}
.vr-grid>div{text-align:center}.vr-grid>div+div{border-left:1px solid #d6dce5}
.vr-pct{font-size:1.05rem;font-weight:700;color:#16a34a}.vr-pct.neg{color:#ef4444}
.vr-lbl{font-size:.72rem;color:#1f2937;margin-top:6px}
.vr-sub{font-size:.6rem;color:#6b7280;margin-top:3px}

/* v29 comissao */
.cm-etapa{font-size:.6rem;opacity:.65;margin-top:6px}
.cm-hero{background:linear-gradient(135deg,#3a4557,#1f2937);border-radius:16px;padding:18px 16px 14px;color:#fff;margin:6px 0 14px;box-shadow:0 4px 14px rgba(15,23,42,.18)}
.cm-top{display:flex;align-items:center;gap:14px}
.cm-ic{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0}
.cm-lbl{font-size:.8rem;opacity:.9}
.cm-val{font-size:1.5rem;font-weight:800;margin-top:2px}

<script>
var SH='https://docs.google.com/spreadsheets/d/e/2PACX-1vS9gWUTuOKx-WK8-p3vk93yJunFAuqVYrdxqPTzuJg3UIAX5GkVOC2wkD_DXIKE9nf0P9xDOgfHwAUZ/pub?gid=92433521&single=true&output=csv';
var RK='https://docs.google.com/spreadsheets/d/e/2PACX-1vRjHX1-Uu8HaBwa7iT_5XSTNkcp2pbSTKTsVsygCKucMChmcI4hTZkC_pNEsuFNeQ/pub?output=csv';
var PT='https://docs.google.com/spreadsheets/d/e/2PACX-1vS9gWUTuOKx-WK8-p3vk93yJunFAuqVYrdxqPTzuJg3UIAX5GkVOC2wkD_DXIKE9nf0P9xDOgfHwAUZ/pub?output=csv';
var CP_M1='https://docs.google.com/spreadsheets/d/e/2PACX-1vTgVTpekyWnlnCtyKnOgisBZ9YM8WOOoNGe6XKH2PslfxaI3GIdjt4g_hEtLJtqYQ/pub?output=csv';
var CP_M2='https://docs.google.com/spreadsheets/d/e/2PACX-1vRrs4woT4Rad3tsqEnkRBkBy4mOvXlP-3s24bIOQ3gaxRgPjfH3Lqw4PgMa1qfo-Q/pub?output=csv';
var CP_NOW='https://docs.google.com/spreadsheets/d/e/2PACX-1vQt4Q6crwYKFDr0p6kbTVwk20IRpUXBvN3Ouftu4DTkle0CoUmbd3PGSikOG14Wdw/pub?output=csv';
var cU=null,rankData=null,pontoData=null,compMonths=[null,null,null];
// loginMap: {cobmaisLogin: fullName} e.g. {"1.gislaine.batista":"Gislaine Miranda Batista"}
// nameMap: {fullNameLower: cobmaisLogin}
var loginMap={},nameMap={},entMap={},entNome={},perfMap={};
var SEC_RE=/andriel+[iy]/i;
// quem NAO bate ponto (nao aparece em Faltas)
var SEM_PONTO=['fatima koepp','luana fernandes'];
function ehSec(raw){return /^5/.test(String(raw||'').trim())||SEC_RE.test(raw||'')} // secretarias que fazem acordo (sem meta)

function fm(v){return'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fs(v){return'R$ '+Math.round(v).toLocaleString('pt-BR')}
function parseBR(s){if(!s)return 0;s=String(s).replace(/"/g,'').trim();if(!s||s==='0')return 0;s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)||0}
function cn(r){r=r.replace(/^[Zz]-?\d*\.?/,'');var n=r.replace(/^[\d]+\.?(\d+\.)?/,'');return n.split('.').map(function(p){return p?p.charAt(0).toUpperCase()+p.slice(1).toLowerCase():''}).filter(function(p){return p}).join(' ')}
function csvSplit(line){var cells=[],cell='',inQ=false;for(var i=0;i<line.length;i++){var c=line[i];if(c==='"')inQ=!inQ;else if(c===','&&!inQ){cells.push(cell);cell=''}else cell+=c}cells.push(cell);return cells}
function normN(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z\s]/g,'').trim()}

// === LOGIN ===
// >>> COLE AQUI a URL do Apps Script (a mesma que esta no sync-login.js, termina com /exec) <<<
var SCRIPT_URL='https://script.google.com/macros/s/AKfycbzL0N1oG-cg9CFfiZ2HdDcLAjzACv3fGGsgdVargDw7bqrf3zhSlHwwRF8YhjHXrGoXqQ/exec';
var temScript=/^https:\/\/script\.google\.com\/.+\/exec$/.test(SCRIPT_URL);
var pwCtx=null; // {key, atual, forcar}
document.getElementById('loginPass').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin()});
function sha(t){
  var b=new TextEncoder().encode(t);
  return crypto.subtle.digest('SHA-256',b).then(function(h){return Array.prototype.map.call(new Uint8Array(h),function(x){return('0'+x.toString(16)).slice(-2)}).join('')});
}
// chave fixa: login SEM o numero do turno (0./1./2.), assim mudar de turno nao reseta a senha
function chaveDe(f){return String(f.login||f.nome||'').trim().toLowerCase().replace(/^\d+\./,'')}
function hashSenha(key,senha){return sha('edimo|'+key+'|'+senha)}
function store(){return localStorage.getItem('mu')?localStorage:sessionStorage}
function salvarSessao(keep){
  var st=keep?localStorage:sessionStorage;
  localStorage.removeItem('mu');sessionStorage.removeItem('mu');
  st.setItem('mu',JSON.stringify(cU));st.setItem('lm',JSON.stringify(loginMap));st.setItem('nm',JSON.stringify(nameMap));st.setItem('em',JSON.stringify(entMap));
}
function lgErr(t){var e=document.getElementById('loginErr');e.textContent=t;e.style.display='block'}
function doLogin(){
  var u=document.getElementById('loginUser').value.trim().toLowerCase(),p=document.getElementById('loginPass').value;
  if(!u||!p)return;
  document.getElementById('loginErr').style.display='none';
  document.getElementById('loginLoad').style.display='block';
  var pSen=temScript?fetch(SCRIPT_URL+'?type=senhas&t='+Date.now()).then(function(r){return r.json()}).catch(function(){return null}):Promise.resolve(null);
  Promise.all([fetch(SH+'&t='+Date.now()).then(function(r){return r.text()}),pSen]).then(function(res){
    var c=res[0],senhas=res[1];
    var rows=c.split('\n').map(function(l){return csvSplit(l)});
    var cand=null;
    for(var i=1;i<rows.length;i++){
      if(rows[i].length<4)continue;
      var nome=rows[i][0].trim(),login=rows[i][1]?rows[i][1].trim():'',senha=rows[i][3]?rows[i][3].trim():'',perfil=rows[i][4]?rows[i][4].trim():'Operador';
      if(login)loginMap[login.toLowerCase()]=nome;
      if(login)entMap[login.toLowerCase()]=rows[i][2]?rows[i][2].trim():'';
      if(nome)nameMap[nome.toLowerCase()]=login.toLowerCase();
      if(!cand&&(nome.toLowerCase()===u||(login&&login.toLowerCase()===u))){
        cand={nome:nome,login:login,perfil:perfil.toLowerCase(),entrada:rows[i][2]?rows[i][2].trim():'',padrao:senha};
      }
    }
    if(!cand){document.getElementById('loginLoad').style.display='none';lgErr('Usu\u00E1rio ou senha incorretos');return}
    if(temScript&&!senhas){document.getElementById('loginLoad').style.display='none';lgErr('Erro de conex\u00E3o, tente de novo');return}
    var key=chaveDe(cand),salva=senhas?senhas[key]:'';
    var check=salva?hashSenha(key,p).then(function(h){return h===salva}):Promise.resolve(cand.padrao===p);
    check.then(function(ok){
      document.getElementById('loginLoad').style.display='none';
      if(!ok){lgErr('Usu\u00E1rio ou senha incorretos');return}
      var padrao=cand.padrao;delete cand.padrao;cU=cand;
      var keep=document.getElementById('loginKeep').checked;
      if(temScript&&!salva){pwCtx={key:key,atual:p,keep:keep,forcar:true};abrirSenha(true);return}
      salvarSessao(keep);showApp();
    });
  }).catch(function(){document.getElementById('loginLoad').style.display='none';lgErr('Erro de conex\u00E3o')});
}
function abrirSenha(forcar){
  if(!temScript){alert('Troca de senha ainda n\u00E3o configurada.');return}
  if(!forcar)pwCtx={key:chaveDe(cU),atual:'',forcar:false};
  document.getElementById('pwTitle').textContent=forcar?'Crie sua senha':'Alterar senha';
  document.getElementById('pwSub').textContent=forcar?'Por seguran\u00E7a, troque a senha padr\u00E3o antes de continuar.':'Digite sua senha atual e a nova senha.';
  document.getElementById('pwAtual').style.display=forcar?'none':'block';
  document.getElementById('pwCancel').style.display=forcar?'none':'block';
  document.getElementById('pwBtn').textContent=forcar?'Salvar e entrar':'Salvar';
  ['pwAtual','pwNova','pwConf'].forEach(function(i){document.getElementById(i).value=''});
  document.getElementById('pwErr').style.display='none';
  document.getElementById('pwBg').style.display='flex';

// Match a Cobmais login against the logged-in user
function isMe(rawLogin){
  if(!cU||!cU.login||!rawLogin)return false;
  // Compare cleaned login: strip prefix numbers/dots, compare core name
  var a=rawLogin.toLowerCase().replace(/^\d+\./,'');
  var b=cU.login.toLowerCase().replace(/^\d+\./,'');
  return a===b;
}
// Get turno from login prefix
function getTurno(login){if(!login)return'';var p=login.charAt(0);if(p==='1')return'm';if(p==='2')return't';if(p==='0')return'n';return''}
// Find ponto entry by full name (fuzzy)
function findPonto(fullName){
  if(!pontoData||!fullName)return null;
  var a=normN(fullName);
  for(var i=0;i<pontoData.length;i++){
    var b=normN(pontoData[i].nome);
    if(a===b)return pontoData[i];
    // Try first+last name
    var pa=a.split(/\s+/),pb=b.split(/\s+/);
    if(pa.length>=2&&pb.length>=2&&pa[0]===pb[0]&&pa[pa.length-1]===pb[pb.length-1])return pontoData[i];
  }
  return null;
}

function loadRanking(){
  return fetch(RK+'&t='+Date.now()).then(function(r){return r.text()}).then(function(csv){
    var lines=csv.split('\n'),dt='',hI=-1;
    for(var i=0;i<lines.length;i++){var m=lines[i].match(/(\d{2}\/\d{2}\/\d{4})\s*at/);if(m){dt=m[1];break}}
    for(var i=0;i<lines.length;i++){if(lines[i].includes(',Operador,')){hI=i;break}}
    if(hI===-1){
      // Try alternate: just "Operador" at start or after empty cells
      for(var i=0;i<lines.length;i++){
        var fc=csvSplit(lines[i]);
        for(var j=0;j<fc.length;j++){
          if(fc[j].trim()==='Operador'){hI=i;break}
        }
        if(hI>=0)break;
      }
    }
    if(hI===-1)return;
    var ops=[],sec=[],ta=0,tv=0;
    for(var i=hI+1;i<lines.length;i++){
      var line=lines[i];if(!line.trim())continue;
      var cells=csvSplit(line);
      var name='';for(var k=0;k<cells.length;k++){if(cells[k].trim()){name=cells[k].trim();break}}
      if(!name)continue;
      if(name.toLowerCase().includes('suporte'))continue;
      var allNums=[];
      for(var k=0;k<cells.length;k++){var v=cells[k].trim().replace(/"/g,'');if(v&&v.match(/[\d]/)){var n=parseBR(v);if(!isNaN(n))allNums.push(n)}}
      if(allNums.length<2)continue;
      var totalVal=allNums[allNums.length-1];
      var totalQtd=Math.round(allNums[allNums.length-2]);
      if(name==='Totais'){ta=totalQtd;tv=totalVal;continue}
      var prefix=name.charAt(0);
      if(prefix!=='0'&&prefix!=='1'&&prefix!=='2'){if(ehSec(name))sec.push({raw:name,n:cn(name),a:totalQtd,v:Math.round(totalVal*100)/100,turno:'',sec:true});continue}
      ops.push({raw:name,n:cn(name),a:totalQtd,v:Math.round(totalVal*100)/100,turno:getTurno(name)});
    }
    // incluir quem nao fez acordo (logins 0/1/2 da planilha de login)
    var EXC=['solange ana batista'];
    var tem={};ops.forEach(function(o){tem[o.raw.toLowerCase().replace(/^\d+\./,'')]=1});
    Object.keys(loginMap).forEach(function(lg){
      var pf=lg.charAt(0);if(pf!=='0'&&pf!=='1'&&pf!=='2')return;
      if(!/^\d+\./.test(lg))return;
      var full=(loginMap[lg]||'').toLowerCase().trim();
      if(EXC.indexOf(full)>=0)return;
      var k=lg.replace(/^\d+\./,'');if(tem[k])return;tem[k]=1;
      ops.push({raw:lg,n:cn(lg),a:0,v:0,turno:getTurno(lg)});
    });
    ops=ops.filter(function(o){var f=(loginMap[o.raw.toLowerCase()]||'').toLowerCase().trim();return EXC.indexOf(f)<0&&o.n.toLowerCase()!=='solange batista'});
    ops.sort(function(a,b){return b.a-a.a||b.v-a.v||a.n.localeCompare(b.n)});
    rankData={d:dt,ta:ta,tv:Math.round(tv*100)/100,ops:ops,sec:sec};
  }).catch(function(e){console.log('Ranking error:',e)});
}

function parseCompCSV(text){
  var lines=text.split('\n'),period='';
  for(var i=0;i<Math.min(lines.length,30);i++){
    var m=lines[i].match(/(\d{2}\/\d{2}\/\d{4})\s*at/);
    if(m){var m2=lines[i].match(/(\d{2}\/\d{2}\/\d{4})\s*at[^\d]*(\d{2}\/\d{2}\/\d{4})/);period=m2?m2[1]+' a '+m2[2]:m[1];break}
  }
  var hI=-1,cols={};
  for(var i=0;i<lines.length;i++){
    if(lines[i].includes('Operador')){
      var hCells=csvSplit(lines[i]);
      if(hCells.join(' ').toLowerCase().match(/quantidade|valor/)){
        hI=i;
        hCells.forEach(function(h,j){
          var hv=h.trim().replace(/"/g,'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
          if(hv==='operador')cols.op=j;
          else if(hv.startsWith('configura'))cols.cfg=j;
          else if(hv==='quantidade')cols.qtd=j;
          else if(hv==='valor')cols.val=j;
          else if(hv==='receita')cols.rec=j;
          else if(hv.startsWith('comiss'))cols.com=j;
        });
        break;
      }
    }
  }
  if(hI===-1||cols.op===undefined)return{period:period,ops:[]};
  var ops=[],sec=[];
  for(var i=hI+1;i<lines.length;i++){
    var line=lines[i].trim();if(!line)continue;
    var cells=csvSplit(line);
    var nm=(cells[cols.op]||'').trim().replace(/^"|"$/g,'');
    if(!nm)continue;
    var nmL=nm.toLowerCase();
    if(nmL==='subtotal'||nmL==='total'||nmL==='totais'||nmL.startsWith('nao')||nmL.startsWith('não')||nm.startsWith('*'))continue;
    if(nmL.includes('suporte'))continue;
    if(/^[Zz]-/.test(nm))continue;
    var cfg=cols.cfg!==undefined?(cells[cols.cfg]||'').trim().replace(/^"|"$/g,''):'';
    if(cfg==='Subtotal')continue;
    var qtd=cols.qtd!==undefined?(parseInt(parseBR(cells[cols.qtd]))||0):0;
    var val=cols.val!==undefined?parseBR(cells[cols.val]):0;
    var rec=cols.rec!==undefined?parseBR(cells[cols.rec]):0;
    var com=cols.com!==undefined?parseBR(cells[cols.com]):0;
    if(qtd===0&&val===0)continue;
    var prefix=nm.charAt(0);if(prefix!=='0'&&prefix!=='1'&&prefix!=='2'){if(ehSec(nm))sec.push({raw:nm,n:cn(nm),cfg:cfg,a:qtd,v:Math.round(val*100)/100,rec:Math.round(rec*100)/100,com:Math.round(com*100)/100,sec:true});continue}
    ops.push({raw:nm,n:cn(nm),cfg:cfg,a:qtd,v:Math.round(val*100)/100,rec:Math.round(rec*100)/100,com:Math.round(com*100)/100});
  }
  return{period:period,ops:ops,sec:sec};
}

// Find my data in comp month by matching raw login
function findMyComp(month){
  if(!month||!month.ops||!cU||!cU.login)return null;
  for(var i=0;i<month.ops.length;i++){if(isMe(month.ops[i].raw))return month.ops[i]}
  var sec=month.sec||[];
  for(var i=0;i<sec.length;i++){if(isMe(sec[i].raw))return sec[i]}
  // secretaria: login do portal pode ser diferente do Cobmais, compara pelo primeiro nome
  var fn=normN(cU.nome||'').split(/\s+/)[0];
  for(var i=0;i<sec.length;i++){if(normN(cn(sec[i].raw)).split(/\s+/)[0]===fn)return sec[i]}
  return null;
}

function diasCasa(en){
  en=en||'';var md=en.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/),dt=null;
  if(md){var yy=+md[3];if(yy<100)yy+=2000;dt=new Date(yy,+md[2]-1,+md[1])}
  else if(/^\d{4}-\d{2}-\d{2}/.test(en))dt=new Date(en.substring(0,10)+'T00:00:00');
  else if(/^\d{5}$/.test(en.trim()))dt=new Date(Date.UTC(1899,11,30)+(+en)*864e5);
  return(dt&&!isNaN(dt))?Math.floor((new Date()-dt)/864e5):-1;
}
function tempoTxt(d){

  if(m>0)return m+(m>1?' meses':' m\u00EAs');

}

// dias uteis: seg-sex = 1, sabado = 0,5, domingo = 0 (feriados nao contam)
function pesoDia(d){var w=d.getDay();return w===0?0:w===6?0.5:1}
function uteisAte(ano,mes,dia){var t=0;for(var i=1;i<=dia;i++)t+=pesoDia(new Date(ano,mes,i));return t}
function diasNoMes(ano,mes){return new Date(ano,mes+1,0).getDate()}
// dia do mes anterior com a mesma quantidade de dias uteis
function diaEquivalente(ano,mes,alvo){var n=diasNoMes(ano,mes),t=0;for(var i=1;i<=n;i++){t+=pesoDia(new Date(ano,mes,i));if(t>=alvo)return i}return n}

  if(histData){for(var d=dEq;d>=1&&!snap;d--){var k=pY+'-'+('0'+(pM+1)).slice(-2)+'-'+('0'+d).slice(-2);if(histData[k]){snap=histData[k];snapDia=d}}}
  var pm={};prv.forEach(function(o){var k=o.raw.toLowerCase().replace(/^\d+\./,'');pm[k]=snap?(snap[k]?{a:snap[k][0],v:snap[k][1]}:{a:0,v:0}):{a:o.a*fator,v:o.v*fator}});

  h+='<div class="kp-grid"><div class="kp"><div class="kp-lbl">Acordos</div><div class="kp-val">'+ac+'</div>'+pc(va,(snap?'':'\u2248 ')+Math.round(ap)+' em '+mesP)+'</div>';

function resetSenha(k,n){
  if(!confirm('Resetar a senha de '+n+' para Edimo123?'))return;
  if(!admPass){admPass=prompt('Confirme a SUA senha de admin:')||'';if(!admPass)return}
  fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({type:'reset',admin:chaveDe(cU),senha:admPass,login:k})})
  .then(function(r){return r.json()}).then(function(r){
    if(r.status==='ok'){alert('Senha de '+n+' resetada!');renderSenhas()}
    else{if(/admin/i.test(r.msg||''))admPass='';alert(r.msg||'N\u00E3o foi poss\u00EDvel resetar')}
  }).catch(function(){alert('Erro de conex\u00E3o')});
}

var trnData=[
  {title:'Boas-Vindas',ic:'\uD83C\uDFE2',lessons:[
    {id:'bv1',name:'Apresenta\u00E7\u00E3o da Empresa',desc:'Conhe\u00E7a a hist\u00F3ria e os valores da \u00C9dimo.',url:'',thumb:'\uD83C\uDFE2'},
    {id:'bv2',name:'Como funciona a cobran\u00E7a',desc:'Entenda o fluxo de trabalho.',url:'',thumb:'\uD83D\uDCCB'},
    {id:'bv3',name:'Regras e Regulamento',desc:'O que voc\u00EA precisa saber.',url:'',thumb:'\uD83D\uDCC4'}]},
  {title:'Sistema Cobmais',ic:'\uD83D\uDCBB',lessons:[
    {id:'cb1',name:'Login e navega\u00E7\u00E3o',desc:'Primeiros passos no sistema.',url:'',thumb:'\uD83D\uDCBB'},
    {id:'cb2',name:'Registrando acordos',desc:'Como registrar um acordo.',url:'',thumb:'\uD83E\uDD1D'},
    {id:'cb3',name:'Relat\u00F3rios',desc:'Como consultar seus n\u00FAmeros.',url:'',thumb:'\uD83D\uDCCA'}]},
  {title:'T\u00E9cnicas de Negocia\u00E7\u00E3o',ic:'\uD83D\uDCDE',lessons:[
    {id:'ng1',name:'Abordagem inicial',desc:'Como iniciar a conversa.',url:'',thumb:'\uD83D\uDCDE'},
    {id:'ng2',name:'Lidando com obje\u00E7\u00F5es',desc:'T\u00E9cnicas para contornar.',url:'',thumb:'\uD83D\uDCAC'},

];
var trnOpen=-1;
function trnDone(){try{return JSON.parse(localStorage.getItem('trnCompleted')||'[]')}catch(e){return[]}}
function renderTreino(){
  var done=trnDone(),tot=0,ok=0;
  trnData.forEach(function(m){m.lessons.forEach(function(l){tot++;if(done.indexOf(l.id)>=0)ok++})});
  var cur=-1;for(var i=0;i<trnData.length;i++){var c=trnData[i].lessons.filter(function(l){return done.indexOf(l.id)>=0}).length;if(c<trnData[i].lessons.length){cur=i;break}}
  var h=hdrPadrao('Treinamento',rankData?rankData.d:'');
  h+='<div class="fill">';
  h+='<div class="tr-hero"><div class="tr-hic">\uD83C\uDF93</div><div><div class="tr-ht">Seu desenvolvimento tamb\u00E9m gera resultados!</div><div class="tr-hs">Aqui voc\u00EA encontra conte\u00FAdos para evoluir no seu desempenho e bater suas metas.</div></div></div>';
  // Em andamento
  h+='<div class="tr-sec"><div class="tr-st"><span class="tr-sic">\u25B7</span> Em andamento</div><div class="tr-lk">'+ok+'/'+tot+' aulas</div></div>';
  if(cur>=0){
    var m=trnData[cur],c=m.lessons.filter(function(l){return done.indexOf(l.id)>=0}).length,pc=Math.round(c/m.lessons.length*100);
    var prox=m.lessons.filter(function(l){return done.indexOf(l.id)<0})[0];
    h+='<div class="tr-and" onclick="trnPlay(\''+prox.id+'\')"><div class="tr-play">\u25B6</div><div class="tr-and-b"><div class="tr-and-top"><div class="tr-and-t">'+m.title+'</div><div class="tr-badge">'+(c>0?'Em progresso':'N\u00E3o iniciado')+'</div></div>';
    h+='<div class="tr-pr"><div class="tr-pb"><div class="tr-pf" style="width:'+Math.max(pc,3)+'%"></div></div><div class="tr-pp">'+pc+'%</div></div>';
    h+='<div class="tr-and-s">'+c+' de '+m.lessons.length+' aulas conclu\u00EDdas \u00B7 Pr\u00F3xima: '+prox.name+'</div></div><div class="tr-ch">\u203A</div></div>';
  }else{
    h+='<div class="tr-and"><div class="tr-play" style="background:#dcfce7;color:#16a34a">\u2714</div><div class="tr-and-b"><div class="tr-and-t">Tudo conclu\u00EDdo!</div><div class="tr-and-s">Voc\u00EA terminou todos os treinamentos.</div></div></div>';
  }
  // Cursos
  h+='<div class="tr-sec"><div class="tr-st"><span class="tr-sic">\uD83D\uDCBC</span> Cursos dispon\u00EDveis</div></div>';
  h+='<div class="tr-list">';
  trnData.forEach(function(m,mi){
    var c=m.lessons.filter(function(l){return done.indexOf(l.id)>=0}).length,fim=c===m.lessons.length,op=trnOpen===mi;
    h+='<div class="tr-cur'+(op?' op':'')+'"><div class="tr-cur-h" onclick="trnToggle('+mi+')"><div class="tr-cic">'+m.ic+'</div><div class="tr-cur-b"><div class="tr-cur-t">'+(mi+1)+'. '+m.title+'</div><div class="tr-cur-s">'+m.lessons.length+' aulas \u00B7 '+(fim?'<b style="color:#16a34a">\u2714 Completo</b>':c+' conclu\u00EDdas')+'</div></div><div class="tr-ch tr-arr">\u203A</div></div>';
    if(op){
      h+='<div class="tr-les">';
      m.lessons.forEach(function(l){var d=done.indexOf(l.id)>=0;
        h+='<div class="tr-le" onclick="trnPlay(\''+l.id+'\')"><div class="tr-lth">'+l.thumb+'</div><div class="tr-lnm">'+l.name+'</div><div class="tr-lck'+(d?' ok':'')+'">'+(d?'\u2714':'')+'</div></div>';
      });
      h+='</div>';
    }
    h+='</div>';
  });
  h+='</div><div class="vtag">v59</div></div>';
  document.getElementById('pgTreino').innerHTML=h;
}
function trnToggle(i){trnOpen=trnOpen===i?-1:i;renderTreino()}
function trnPlay(id){
  var les=null,mi=-1;trnData.forEach(function(m,i){m.lessons.forEach(function(l){if(l.id===id){les=l;mi=i}})});
  if(!les)return;
  var pl='';
  if(les.url){var v=les.url.match(/(?:v=|youtu\.be\/|embed\/)([\w-]+)/);
    pl=(v&&/youtu/.test(les.url))?'<iframe src="https://www.youtube.com/embed/'+v[1]+'" allowfullscreen allow="autoplay; encrypted-media"></iframe>':'<video controls playsinline src="'+les.url+'"></video>';
  }else pl='<div class="tr-ph"><div style="font-size:3rem">'+les.thumb+'</div><div style="margin-top:10px;font-weight:600">V\u00EDdeo em breve</div></div>';
  var ov=document.createElement('div');ov.className='tr-ov';ov.onclick=function(e){if(e.target===ov){ov.remove();renderTreino()}};
  ov.innerHTML='<div class="tr-sh"><div class="tr-shh"><div class="tr-sht">'+les.name+'</div><div class="tr-x" onclick="this.closest(\'.tr-ov\').remove();renderTreino()">\u2715</div></div><div class="tr-pl">'+pl+'</div><div class="tr-ds">'+les.desc+'</div><button class="tr-btn" onclick="trnMark(\''+id+'\');this.closest(\'.tr-ov\').remove()">\u2714 Marcar como conclu\u00EDda</button></div>';
  document.body.appendChild(ov);
  trnOpen=mi;
}
function trnMark(id){var d=trnDone();if(d.indexOf(id)<0){d.push(id);localStorage.setItem('trnCompleted',JSON.stringify(d))}renderTreino()}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
