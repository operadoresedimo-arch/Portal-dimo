<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Édimo Portal</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f2440">
<link rel="apple-touch-icon" href="logo192.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:linear-gradient(180deg,#eef2f7,#f5f7fa);color:#1a1f36;min-height:100vh;-webkit-font-smoothing:antialiased}
.login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-box{width:100%;max-width:360px;background:#fff;border-radius:16px;padding:40px 28px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.login-logo{font-size:.65rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#d4a937;margin-bottom:28px}
.login-box input{width:100%;padding:13px 14px;border:1px solid #e5e7eb;border-radius:10px;background:#f9fafb;font-family:inherit;font-size:.82rem;color:#1a1f36;margin-bottom:10px;outline:none}
.login-box input:focus{border-color:#2563eb}
.login-box input::placeholder{color:#9ca3af}
.login-btn{width:100%;padding:13px;border:none;border-radius:10px;background:#2563eb;color:#fff;font-family:inherit;font-size:.82rem;font-weight:700;cursor:pointer}
.login-err{color:#ef4444;font-size:.7rem;margin-top:10px;display:none}
.login-load{color:#9ca3af;font-size:.7rem;margin-top:10px;display:none}
.app{display:none;min-height:100vh;padding-bottom:68px}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:max(14px,env(safe-area-inset-top,14px)) 16px 10px;background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:10}
.hdr-title{font-size:1rem;font-weight:800}.hdr-date{font-size:.58rem;color:#9ca3af;margin-top:1px}
.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e7eb;display:flex;justify-content:space-around;padding:6px 0 max(6px,env(safe-area-inset-bottom));z-index:50}
.bar-btn{display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:none;color:#9ca3af;font-size:.52rem;font-weight:600;font-family:inherit;cursor:pointer;padding:4px 12px;position:relative;transition:color .15s}
.bar-btn.on{color:#2563eb}
.bar-btn.on::before{content:"";position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:20px;height:3px;background:#2563eb;border-radius:2px}
.bar-btn svg{width:22px;height:22px}
.pg{display:none;padding:0 14px 16px}.pg.on{display:block}
.hero{background:linear-gradient(135deg,#2a5a9e,#1a4278);border-radius:18px;padding:18px 16px;color:#fff;display:flex;align-items:center;gap:14px;margin:12px 0;position:relative}
.hero-trophy{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0}
.hero-body{flex:1}
.hero-lbl{font-size:.62rem;font-weight:600;opacity:.8}
.hero-val{font-size:1.65rem;font-weight:900;margin:3px 0 2px}
.hero-sub{font-size:.58rem;opacity:.5}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.st{background:#fff;border-radius:12px;padding:14px;border:1px solid #e5e7eb}
.st-icon{font-size:1.1rem;margin-bottom:5px}.st-lbl{font-size:.5rem;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.06em}
.st-val{font-size:1.25rem;font-weight:800;margin-top:2px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px}
.sec-t{font-size:.9rem;font-weight:800}.sec-link{font-size:.62rem;color:#2563eb;font-weight:600}
.pod{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;border:1px solid #e5e7eb}
.pod:first-child{border-color:rgba(212,169,55,.25);background:linear-gradient(135deg,rgba(212,169,55,.04),#fff)}
.pod-medal{font-size:1.5rem;flex-shrink:0}.pod-info{flex:1;min-width:0}
.pod-nm{font-size:.8rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod-st{font-size:.6rem;color:#9ca3af;margin-top:2px}
.pod-pos{font-size:1.05rem;font-weight:900;color:#9ca3af}
.pod:first-child .pod-pos{color:#d4a937}
.srch{width:100%;padding:10px 14px;margin:12px 0;border:1px solid #e5e7eb;border-radius:10px;background:#fff;font-family:inherit;font-size:.8rem;color:#1a1f36;outline:none}
.srch:focus{border-color:#2563eb}
.rw{display:flex;align-items:center;gap:10px;padding:12px;background:#fff;border-radius:12px;margin-bottom:6px;border:1px solid #e5e7eb}
.rw.miss{opacity:.4}
.rw-rk{font-size:.7rem;font-weight:700;color:#9ca3af;width:20px;text-align:center}
.rw-av{width:34px;height:34px;border-radius:50%;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:#6b7280;flex-shrink:0}
.rw-info{flex:1;min-width:0}.rw-nm{font-size:.76rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw-sub{font-size:.55rem;color:#9ca3af;margin-top:1px}
.rw-val{text-align:right}.rw-a{font-size:.82rem;font-weight:800}.rw-v{font-size:.55rem;color:#9ca3af}
.turno{font-size:.42rem;font-weight:700;padding:2px 5px;border-radius:4px;margin-left:3px;vertical-align:middle}
.t-m{color:#16a34a;background:rgba(22,163,74,.08)}.t-t{color:#f59e0b;background:rgba(245,158,11,.08)}.t-n{color:#8b5cf6;background:rgba(139,92,246,.08)}
.cc-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
.cc{background:#fff;border-radius:12px;padding:12px;border:1px solid #e5e7eb;text-align:center}
.cc-lbl{font-size:.48rem;font-weight:600;color:#9ca3af;text-transform:uppercase;margin-bottom:4px}
.cc-val{font-size:1rem;font-weight:800}.cc-pct{font-size:.6rem;font-weight:700;color:#16a34a;margin-top:2px}.cc-pct.neg{color:#ef4444}
.card{background:#fff;border-radius:14px;padding:16px;border:1px solid #e5e7eb;margin:12px 0}
.card-t{font-size:.75rem;font-weight:700;margin-bottom:10px}
.chart-bars{display:flex;justify-content:space-around;align-items:flex-end;height:120px;gap:8px}
.chart-col{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.chart-bar{width:100%;border-radius:6px 6px 0 0;min-height:4px}
.chart-lbl{font-size:.5rem;color:#9ca3af;font-weight:600}.chart-v{font-size:.6rem;font-weight:700}.chart-a{font-size:.5rem;color:#9ca3af}
.var-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.var-pct{font-size:1rem;font-weight:800;color:#16a34a;text-align:center}.var-pct.neg{color:#ef4444}
.var-lbl{font-size:.48rem;color:#9ca3af;text-align:center;margin-top:2px}
.rew-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
.rew{background:#fff;border-radius:10px;padding:10px 8px;border:1px solid #e5e7eb;text-align:center}
.rew.hl{border-color:#d4a937;border-width:2px}.rew-val{font-size:.82rem;font-weight:800}.rew-lbl{font-size:.45rem;color:#9ca3af;margin-top:2px}
.ben-item{display:flex;align-items:center;gap:12px;padding:14px;background:#fff;border-radius:12px;border:1px solid #e5e7eb;margin-bottom:6px}
.ben-icon{width:36px;height:36px;border-radius:10px;background:#f0f2f5;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}
.ben-nm{font-size:.75rem;font-weight:700}.ben-desc{font-size:.58rem;color:#9ca3af}
.tre-item{display:flex;align-items:center;gap:12px;padding:14px;background:#fff;border-radius:12px;border:1px solid #e5e7eb;margin-bottom:6px}
.tre-prog{height:6px;background:#e5e7eb;border-radius:4px;overflow:hidden;margin-top:6px;width:100%}
.tre-prog-fill{height:100%;background:#16a34a;border-radius:4px}
.msg{margin:12px 0;padding:14px;border-radius:12px;font-size:.72rem;font-weight:600;display:flex;align-items:center;gap:8px;background:rgba(37,99,235,.05);color:#2563eb;border:1px solid rgba(37,99,235,.12)}
.menu-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;display:none}.menu-bg.on{display:block}
.menu-sheet{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:20px 20px 0 0;padding:12px 16px max(24px,env(safe-area-inset-bottom));z-index:61;transform:translateY(100%);transition:transform .25s}
.menu-bg.on .menu-sheet{transform:translateY(0)}
.menu-h{width:40px;height:4px;background:#d1d5db;border-radius:4px;margin:0 auto 16px}
.menu-item{display:flex;align-items:center;gap:12px;width:100%;padding:14px 12px;border:none;background:none;font-size:.82rem;font-weight:600;color:#1a1f36;font-family:inherit;cursor:pointer;border-radius:10px;text-align:left}
.menu-item:active{background:#f3f4f6}
.menu-item.out{color:#ef4444;margin-top:8px;border-top:1px solid #e5e7eb;padding-top:14px;border-radius:0}

.top3-card{display:flex;align-items:center;gap:14px;padding:16px;background:#fff;border-radius:18px;margin-bottom:10px;border:1px solid #e5e7eb;min-height:76px}
.top3-left{position:relative;flex-shrink:0;width:54px;height:54px}
.top3-medal{position:absolute;bottom:-4px;left:-6px;font-size:1.3rem;z-index:2;filter:drop-shadow(0 1px 2px rgba(0,0,0,.15))}
.top3-av{width:54px;height:54px;border-radius:50%;background:#d0d0d0;display:flex;align-items:center;justify-content:center;font-size:1.15rem;font-weight:800;color:#fff;border:3px solid #d0d0d0}
.top3-info{flex:1;min-width:0}
.top3-nm{font-size:.92rem;font-weight:700;color:#1a1f36}
.top3-st{font-size:.65rem;color:#9ca3af;margin-top:3px}
.top3-pos{font-size:1.5rem;font-weight:900;flex-shrink:0}

.duo-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 6px}
.duo{background:#fff;border-radius:16px;padding:16px 14px;border:1px solid #e5e7eb;display:flex;align-items:center;gap:12px}
.duo-icon{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
.duo-lbl{font-size:.65rem;font-weight:700;color:#1a1f36}
.duo-val{font-size:1.5rem;font-weight:900;color:#1a1f36;margin-top:1px;display:flex;align-items:center;gap:6px}
.duo-pct{font-size:.55rem;font-weight:700;color:#16a34a}
</style>
</head>
<body>
<div class="login" id="loginScreen">
<div class="login-box">
<div class="login-logo">🏛️ Édimo · Soluções em Cobranças</div>

<input type="text" id="loginUser" placeholder="Login" autocomplete="off">
<input type="password" id="loginPass" placeholder="Senha">
<button class="login-btn" onclick="doLogin()">Entrar</button>
<div class="login-err" id="loginErr">Usuário ou senha incorretos</div>
<div class="login-load" id="loginLoad">Verificando...</div>
</div>
</div>
<div class="app" id="app">
<div class="pg on" id="pgInicio"></div>
<div class="pg" id="pgAcordos"></div>
<div class="pg" id="pgComp"></div>
<div class="pg" id="pgTreino"></div>
<div class="bar">
<button class="bar-btn on" data-t="inicio" onclick="go('inicio')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg><span>Início</span></button>
<button class="bar-btn" data-t="acordos" onclick="go('acordos')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg><span>Acordos</span></button>
<button class="bar-btn" data-t="comp" onclick="go('comp')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg><span>Comparativo</span></button>
<button class="bar-btn" data-t="treino" onclick="go('treino')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2zM22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg><span>Treinamento</span></button>
<button class="bar-btn" data-t="mais" onclick="openMenu()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg><span>Mais</span></button>
</div>
</div>
<div class="menu-bg" id="menuBg" onclick="closeMenu()">
<div class="menu-sheet" onclick="event.stopPropagation()">
<div class="menu-h"></div>
<button class="menu-item" onclick="closeMenu();go('comissao')">💰 Comissão</button>
<button class="menu-item" onclick="closeMenu();go('beneficios')">🎯 Benefícios</button>
<button class="menu-item" onclick="closeMenu();go('faltas')">🔔 Faltas do Dia</button>
<button class="menu-item out" onclick="doLogout()">🚪 Sair</button>
</div>
</div>
<script>
var SH='https://docs.google.com/spreadsheets/d/e/2PACX-1vS9gWUTuOKx-WK8-p3vk93yJunFAuqVYrdxqPTzuJg3UIAX5GkVOC2wkD_DXIKE9nf0P9xDOgfHwAUZ/pub?gid=92433521&single=true&output=csv';
var RK='https://docs.google.com/spreadsheets/d/e/2PACX-1vRjHX1-Uu8HaBwa7iT_5XSTNkcp2pbSTKTsVsygCKucMChmcI4hTZkC_pNEsuFNeQ/pub?output=csv';
var PT='https://docs.google.com/spreadsheets/d/e/2PACX-1vS9gWUTuOKx-WK8-p3vk93yJunFAuqVYrdxqPTzuJg3UIAX5GkVOC2wkD_DXIKE9nf0P9xDOgfHwAUZ/pub?output=csv';
var CP_M1='https://docs.google.com/spreadsheets/d/e/2PACX-1vRd-WnBwsOyBqVeunc1jH3sTzou9KGZllzJYA1QpKC_wk21Y4Cw9A2KprRbowWDRw/pub?output=csv';
var CP_M2='https://docs.google.com/spreadsheets/d/e/2PACX-1vTgVTpekyWnlnCtyKnOgisBZ9YM8WOOoNGe6XKH2PslfxaI3GIdjt4g_hEtLJtqYQ/pub?output=csv';
var CP_NOW='https://docs.google.com/spreadsheets/d/e/2PACX-1vRrs4woT4Rad3tsqEnkRBkBy4mOvXlP-3s24bIOQ3gaxRgPjfH3Lqw4PgMa1qfo-Q/pub?output=csv';
var cU=null,rankData=null,pontoData=null,compMonths=[null,null,null];
// loginMap: {cobmaisLogin: fullName} e.g. {"1.gislaine.batista":"Gislaine Miranda Batista"}
// nameMap: {fullNameLower: cobmaisLogin}
var loginMap={},nameMap={};

function fm(v){return'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fs(v){return'R$ '+Math.round(v).toLocaleString('pt-BR')}
function parseBR(s){if(!s)return 0;s=String(s).replace(/"/g,'').trim();if(!s||s==='0')return 0;s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)||0}
function cn(r){r=r.replace(/^[Zz]-?\d*\.?/,'');var n=r.replace(/^[\d]+\.?(\d+\.)?/,'');return n.split('.').map(function(p){return p?p.charAt(0).toUpperCase()+p.slice(1).toLowerCase():''}).filter(function(p){return p}).join(' ')}
function csvSplit(line){var cells=[],cell='',inQ=false;for(var i=0;i<line.length;i++){var c=line[i];if(c==='"')inQ=!inQ;else if(c===','&&!inQ){cells.push(cell);cell=''}else cell+=c}cells.push(cell);return cells}
function normN(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z\s]/g,'').trim()}

// === LOGIN ===
document.getElementById('loginPass').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin()});
function doLogin(){
  var u=document.getElementById('loginUser').value.trim().toLowerCase(),p=document.getElementById('loginPass').value;
  if(!u||!p)return;
  document.getElementById('loginErr').style.display='none';
  document.getElementById('loginLoad').style.display='block';
  fetch(SH).then(function(r){return r.text()}).then(function(c){
    var rows=c.split('\n').map(function(l){return csvSplit(l)});
    var found=null;
    for(var i=1;i<rows.length;i++){
      if(rows[i].length<4)continue;
      var nome=rows[i][0].trim(),login=rows[i][1]?rows[i][1].trim():'',senha=rows[i][3]?rows[i][3].trim():'',perfil=rows[i][4]?rows[i][4].trim():'Operador';
      if(login)loginMap[login.toLowerCase()]=nome;
      if(nome)nameMap[nome.toLowerCase()]=login.toLowerCase();
      if((nome.toLowerCase()===u||login.toLowerCase()===u)&&senha===p){
        found={nome:nome,login:login,perfil:perfil.toLowerCase(),entrada:rows[i][2]?rows[i][2].trim():''}
      }
    }
    document.getElementById('loginLoad').style.display='none';
    if(found){cU=found;sessionStorage.setItem('mu',JSON.stringify(found));sessionStorage.setItem('lm',JSON.stringify(loginMap));sessionStorage.setItem('nm',JSON.stringify(nameMap));showApp()}
    else{document.getElementById('loginErr').style.display='block'}
  }).catch(function(){document.getElementById('loginLoad').style.display='none';document.getElementById('loginErr').textContent='Erro de conexão';document.getElementById('loginErr').style.display='block'});
}
function doLogout(){sessionStorage.clear();location.reload()}
window.addEventListener('load',function(){
  var s=sessionStorage.getItem('mu');
  if(s){try{cU=JSON.parse(s);loginMap=JSON.parse(sessionStorage.getItem('lm')||'{}');nameMap=JSON.parse(sessionStorage.getItem('nm')||'{}');showApp()}catch(e){}}
});
function showApp(){document.getElementById('loginScreen').style.display='none';document.getElementById('app').style.display='block';window.scrollTo(0,0);loadData()}

// === MATCH FUNCTIONS ===
// Match a Cobmais login against the logged-in user
function isMe(rawLogin){
  if(!cU||!cU.login||!rawLogin)return false;
  // Compare cleaned login: strip prefix numbers/dots, compare core name
  var a=rawLogin.toLowerCase().replace(/^\d+\./,'');
  var b=cU.login.toLowerCase().replace(/^\d+\./,'');
  return a===b;
}
// Get turno from login prefix
function getTurno(login){if(!login)return'';var p=login.charAt(0);if(p==='1')return'm';if(p==='2')return't';if(p==='0')return'n';return''}
// Find ponto entry by full name (fuzzy)
function findPonto(fullName){
  if(!pontoData||!fullName)return null;
  var a=normN(fullName);
  for(var i=0;i<pontoData.length;i++){
    var b=normN(pontoData[i].nome);
    if(a===b)return pontoData[i];
    // Try first+last name
    var pa=a.split(/\s+/),pb=b.split(/\s+/);
    if(pa.length>=2&&pb.length>=2&&pa[0]===pb[0]&&pa[pa.length-1]===pb[pb.length-1])return pontoData[i];
  }
  return null;
}
function pontoStatus(p){if(!p)return'';var s=p.status.toUpperCase();if(s.includes('PRESENTE'))return'ok';if(s.includes('ATRASADO'))return'late';if(s.includes('FALTOU'))return'miss';return'miss'}
function getFullName(login){return loginMap[login.toLowerCase()]||cn(login)}

// === DATA LOADING ===
function loadData(){Promise.all([loadRanking(),loadPonto(),loadComp()]).then(function(){go('inicio')})}

function loadRanking(){
  return fetch(RK+'&t='+Date.now()).then(function(r){return r.text()}).then(function(csv){
    var lines=csv.split('\n'),dt='',hI=-1;
    for(var i=0;i<lines.length;i++){var m=lines[i].match(/(\d{2}\/\d{2}\/\d{4})\s*at/);if(m){dt=m[1];break}}
    for(var i=0;i<lines.length;i++){if(lines[i].includes(',Operador,')){hI=i;break}}
    if(hI===-1){
      // Try alternate: just "Operador" at start or after empty cells
      for(var i=0;i<lines.length;i++){
        var fc=csvSplit(lines[i]);
        for(var j=0;j<fc.length;j++){
          if(fc[j].trim()==='Operador'){hI=i;break}
        }
        if(hI>=0)break;
      }
    }
    if(hI===-1)return;
    var ops=[],ta=0,tv=0;
    for(var i=hI+1;i<lines.length;i++){
      var line=lines[i];if(!line.trim())continue;
      var cells=csvSplit(line);
      var name='';for(var k=0;k<cells.length;k++){if(cells[k].trim()){name=cells[k].trim();break}}
      if(!name)continue;
      if(name.toLowerCase().includes('suporte'))continue;
      var allNums=[];
      for(var k=0;k<cells.length;k++){var v=cells[k].trim().replace(/"/g,'');if(v&&v.match(/[\d]/)){var n=parseBR(v);if(!isNaN(n))allNums.push(n)}}
      if(allNums.length<2)continue;
      var totalVal=allNums[allNums.length-1];
      var totalQtd=Math.round(allNums[allNums.length-2]);
      if(name==='Totais'){ta=totalQtd;tv=totalVal;continue}
      if(totalQtd===0&&totalVal===0)continue;
      var prefix=name.charAt(0);
      if(prefix!=='0'&&prefix!=='1'&&prefix!=='2')continue;
      ops.push({raw:name,n:cn(name),a:totalQtd,v:Math.round(totalVal*100)/100,turno:getTurno(name)});
    }
    ops.sort(function(a,b){return b.a-a.a||b.v-a.v});
    rankData={d:dt,ta:ta,tv:Math.round(tv*100)/100,ops:ops};
  }).catch(function(e){console.log('Ranking error:',e)});
}

function loadPonto(){
  return fetch(PT+'&t='+Date.now()).then(function(r){return r.text()}).then(function(csv){
    var lines=csv.split('\n'),rows=[];
    for(var i=1;i<lines.length;i++){
      var cells=csvSplit(lines[i]);
      if(cells[0]&&!cells[0].includes('RESUMO')&&!cells[0].includes('---'))
        rows.push({nome:cells[0].trim(),status:(cells[1]||'').trim(),entrada:(cells[2]||'').trim()});
    }
    pontoData=rows;
  }).catch(function(){});
}

function loadComp(){
  return Promise.all([
    fetch(CP_M1+'&t='+Date.now()).then(function(r){return r.text()}),
    fetch(CP_M2+'&t='+Date.now()).then(function(r){return r.text()}),

  ]).then(function(csvs){
    csvs.forEach(function(csv,idx){compMonths[idx]=parseCompCSV(csv)});
  }).catch(function(e){console.log('Comp error:',e)});
}

function parseCompCSV(text){
  var lines=text.split('\n'),period='';
  for(var i=0;i<Math.min(lines.length,30);i++){
    var m=lines[i].match(/(\d{2}\/\d{2}\/\d{4})\s*at/);
    if(m){var m2=lines[i].match(/(\d{2}\/\d{2}\/\d{4})\s*at[^\d]*(\d{2}\/\d{2}\/\d{4})/);period=m2?m2[1]+' a '+m2[2]:m[1];break}
  }
  var hI=-1,cols={};
  for(var i=0;i<lines.length;i++){
    if(lines[i].includes('Operador')){
      var hCells=csvSplit(lines[i]);
      if(hCells.join(' ').toLowerCase().match(/quantidade|valor/)){
        hI=i;
        hCells.forEach(function(h,j){
          var hv=h.trim().replace(/"/g,'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
          if(hv==='operador')cols.op=j;
          else if(hv.startsWith('configura'))cols.cfg=j;
          else if(hv==='quantidade')cols.qtd=j;
          else if(hv==='valor')cols.val=j;
          else if(hv==='receita')cols.rec=j;
          else if(hv.startsWith('comiss'))cols.com=j;
        });
        break;
      }
    }
  }
  if(hI===-1||cols.op===undefined)return{period:period,ops:[]};
  var ops=[];
  for(var i=hI+1;i<lines.length;i++){
    var line=lines[i].trim();if(!line)continue;
    var cells=csvSplit(line);
    var nm=(cells[cols.op]||'').trim().replace(/^"|"$/g,'');
    if(!nm)continue;
    var nmL=nm.toLowerCase();
    if(nmL==='subtotal'||nmL==='total'||nmL==='totais'||nmL.startsWith('nao')||nmL.startsWith('não')||nm.startsWith('*'))continue;
    if(nmL.includes('suporte'))continue;
    if(/^[Zz]-/.test(nm))continue;
    var cfg=cols.cfg!==undefined?(cells[cols.cfg]||'').trim().replace(/^"|"$/g,''):'';
    if(cfg==='Subtotal')continue;
    var qtd=cols.qtd!==undefined?(parseInt(parseBR(cells[cols.qtd]))||0):0;
    var val=cols.val!==undefined?parseBR(cells[cols.val]):0;
    var rec=cols.rec!==undefined?parseBR(cells[cols.rec]):0;
    var com=cols.com!==undefined?parseBR(cells[cols.com]):0;
    if(qtd===0&&val===0)continue;
    var prefix=nm.charAt(0);if(prefix!=='0'&&prefix!=='1'&&prefix!=='2')continue;
    ops.push({raw:nm,n:cn(nm),cfg:cfg,a:qtd,v:Math.round(val*100)/100,rec:Math.round(rec*100)/100,com:Math.round(com*100)/100});
  }
  return{period:period,ops:ops};
}

// Find my data in comp month by matching raw login
function findMyComp(month){
  if(!month||!month.ops||!cU||!cU.login)return null;
  for(var i=0;i<month.ops.length;i++){if(isMe(month.ops[i].raw))return month.ops[i]}
  return null;
}

}
