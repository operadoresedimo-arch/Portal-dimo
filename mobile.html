<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Édimo Portal</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f2440">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="logo192.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:#f0f2f5;color:#1a1f36;min-height:100vh;-webkit-font-smoothing:antialiased}

/* LOGIN */
.login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:#f0f2f5}
.login-box{width:100%;max-width:360px;background:#fff;border-radius:16px;padding:40px 28px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.login-logo{font-size:.65rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#d4a937;margin-bottom:28px}
.login-box input{width:100%;padding:13px 14px;border:1px solid #e5e7eb;border-radius:10px;background:#f9fafb;font-family:inherit;font-size:.82rem;color:#1a1f36;margin-bottom:10px;outline:none}
.login-box input:focus{border-color:#2563eb}
.login-box input::placeholder{color:#9ca3af}
.login-btn{width:100%;padding:13px;border:none;border-radius:10px;background:#2563eb;color:#fff;font-family:inherit;font-size:.82rem;font-weight:700;cursor:pointer;margin-top:4px}
.login-err{color:#ef4444;font-size:.7rem;margin-top:10px;display:none}
.login-load{color:#9ca3af;font-size:.7rem;margin-top:10px;display:none}

/* APP SHELL */
.app{display:none;min-height:100vh;padding-bottom:68px}

/* HEADER */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:10}
.hdr-l{}
.hdr-title{font-size:1.05rem;font-weight:800;color:#1a1f36}
.hdr-date{font-size:.6rem;color:#9ca3af;margin-top:1px}
.hdr-btn{padding:6px 14px;border:1px solid #e5e7eb;border-radius:8px;background:#fff;font-size:.65rem;font-weight:600;color:#1a1f36;font-family:inherit;cursor:pointer}

/* BOTTOM BAR */
.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e7eb;display:flex;justify-content:space-around;padding:6px 0 max(6px,env(safe-area-inset-bottom));z-index:50}
.bar-btn{display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:none;color:#9ca3af;font-size:.52rem;font-weight:600;font-family:inherit;cursor:pointer;padding:4px 10px;position:relative}
.bar-btn.on{color:#2563eb}
.bar-btn svg{width:22px;height:22px}

/* PAGES */
.pg{display:none;padding:0 14px 16px}
.pg.on{display:block}

/* === PAGE: INICIO === */
.hero{background:linear-gradient(135deg,#1a3558,#0f2440);border-radius:16px;padding:22px 20px;color:#fff;position:relative;overflow:hidden;margin:12px 0}
.hero::after{content:"";position:absolute;top:-20px;right:-20px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.04)}
.hero-icon{position:absolute;top:16px;right:18px;font-size:2.2rem;opacity:.22}
.hero-lbl{font-size:.58rem;font-weight:600;opacity:.6;text-transform:uppercase;letter-spacing:.06em}
.hero-val{font-size:2.1rem;font-weight:900;margin:6px 0 2px}
.hero-sub{font-size:.68rem;opacity:.5}
.hero-pct{position:absolute;top:18px;right:60px;background:rgba(255,255,255,.12);padding:3px 8px;border-radius:6px;font-size:.6rem;font-weight:700}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.st{background:#fff;border-radius:12px;padding:14px;border:1px solid #e5e7eb}
.st-icon{font-size:1.1rem;margin-bottom:5px}
.st-lbl{font-size:.5rem;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.06em}
.st-val{font-size:1.25rem;font-weight:800;margin-top:2px}
.st-val.grn{color:#16a34a}
.st-ponto{font-size:.82rem;font-weight:700}
.st-ponto .ok{color:#16a34a}.st-ponto .late{color:#f59e0b}.st-ponto .miss{color:#ef4444}

.sec{display:flex;justify-content:space-between;align-items:center;margin:16px 0 10px}
.sec-t{font-size:.85rem;font-weight:800;color:#1a1f36}
.sec-link{font-size:.6rem;color:#2563eb;font-weight:600}

.pod{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;border:1px solid #e5e7eb}
.pod:first-child{border-color:rgba(212,169,55,.25);background:linear-gradient(135deg,rgba(212,169,55,.04),#fff)}
.pod-medal{font-size:1.5rem;flex-shrink:0}
.pod-info{flex:1;min-width:0}
.pod-nm{font-size:.8rem;font-weight:700;color:#1a1f36;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod-st{font-size:.6rem;color:#9ca3af;margin-top:2px}
.pod-pos{font-size:1.05rem;font-weight:900;color:#9ca3af}
.pod:first-child .pod-pos{color:#d4a937}

/* === PAGE: ACORDOS === */
.srch{width:100%;padding:10px 14px;margin:12px 0;border:1px solid #e5e7eb;border-radius:10px;background:#fff;font-family:inherit;font-size:.8rem;color:#1a1f36;outline:none}
.srch:focus{border-color:#2563eb}
.filters{display:flex;gap:6px;margin-bottom:12px}
.flt{padding:6px 14px;border-radius:20px;border:1px solid #e5e7eb;background:#fff;font-size:.62rem;font-weight:600;color:#9ca3af;font-family:inherit;cursor:pointer}
.flt.on{background:#2563eb;color:#fff;border-color:#2563eb}
.rw{display:flex;align-items:center;gap:10px;padding:12px;background:#fff;border-radius:12px;margin-bottom:6px;border:1px solid #e5e7eb}
.rw.miss{opacity:.4}
.rw-rk{font-size:.7rem;font-weight:700;color:#9ca3af;width:20px;text-align:center}
.rw-av{width:34px;height:34px;border-radius:50%;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:#6b7280;flex-shrink:0}
.rw-info{flex:1;min-width:0}
.rw-nm{font-size:.76rem;font-weight:600;color:#1a1f36;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw-sub{font-size:.55rem;color:#9ca3af;margin-top:1px}
.rw-val{text-align:right}
.rw-a{font-size:.82rem;font-weight:800;color:#1a1f36}
.rw-v{font-size:.55rem;color:#9ca3af}
.turno{font-size:.42rem;font-weight:700;padding:2px 5px;border-radius:4px;margin-left:3px;vertical-align:middle}
.t-m{color:#16a34a;background:rgba(22,163,74,.08)}.t-t{color:#f59e0b;background:rgba(245,158,11,.08)}.t-n{color:#8b5cf6;background:rgba(139,92,246,.08)}

/* === PAGE: COMPARATIVO === */
.comp-cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
.cc{background:#fff;border-radius:12px;padding:12px;border:1px solid #e5e7eb;text-align:center}
.cc-val{font-size:1.1rem;font-weight:800;color:#1a1f36}
.cc-lbl{font-size:.48rem;font-weight:600;color:#9ca3af;text-transform:uppercase;margin-bottom:4px}
.cc-pct{font-size:.6rem;font-weight:700;color:#16a34a;margin-top:2px}
.cc-pct.neg{color:#ef4444}

.chart-box{background:#fff;border-radius:14px;padding:16px;border:1px solid #e5e7eb;margin:12px 0}
.chart-title{font-size:.75rem;font-weight:700;color:#1a1f36;margin-bottom:12px}
.chart-bars{display:flex;justify-content:space-around;align-items:flex-end;height:120px;gap:8px}
.chart-col{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.chart-bar{width:100%;border-radius:6px 6px 0 0;min-height:4px}
.chart-bar.val{background:#2563eb}
.chart-bar.ac{background:#93c5fd;margin-top:2px}
.chart-lbl{font-size:.5rem;color:#9ca3af;font-weight:600}
.chart-v{font-size:.6rem;font-weight:700;color:#1a1f36}
.chart-a{font-size:.5rem;color:#9ca3af}

.var-box{background:#fff;border-radius:14px;padding:16px;border:1px solid #e5e7eb;margin:12px 0}
.var-title{font-size:.75rem;font-weight:700;color:#1a1f36;margin-bottom:10px}
.var-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.var-item{text-align:center}
.var-pct{font-size:1rem;font-weight:800;color:#16a34a}
.var-pct.neg{color:#ef4444}
.var-lbl{font-size:.5rem;color:#9ca3af;margin-top:2px}

/* === PAGE: COMISSAO === */
.com-hero{background:linear-gradient(135deg,#1a3558,#0f2440);border-radius:16px;padding:20px;color:#fff;margin:12px 0}
.com-lbl{font-size:.6rem;opacity:.6;margin-bottom:4px}
.com-val{font-size:2rem;font-weight:900}
.com-bar{height:10px;background:rgba(255,255,255,.15);border-radius:6px;overflow:hidden;margin:10px 0 6px}
.com-fill{height:100%;background:#16a34a;border-radius:6px}
.com-pct{position:absolute;right:0;top:-2px;font-size:.6rem;font-weight:700;color:#16a34a;background:rgba(22,163,74,.15);padding:2px 6px;border-radius:4px}
.com-range{display:flex;justify-content:space-between;font-size:.55rem;opacity:.5}
.comp-vs{background:#fff;border-radius:14px;padding:16px;border:1px solid #e5e7eb;margin:12px 0}
.comp-vs-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.cv{text-align:center;padding:10px;border:1px solid #e5e7eb;border-radius:10px}
.cv-val{font-size:.9rem;font-weight:800;color:#1a1f36}
.cv-lbl{font-size:.48rem;color:#9ca3af;margin-top:2px}
.cv-pct{font-size:.85rem;font-weight:800;color:#16a34a}
.det-box{background:#fff;border-radius:14px;padding:16px;border:1px solid #e5e7eb;margin:12px 0}
.det-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f3f4f6}
.det-row:last-child{border-bottom:none}
.det-left{display:flex;align-items:center;gap:10px}
.det-icon{width:32px;height:32px;border-radius:8px;background:#f0f2f5;display:flex;align-items:center;justify-content:center;font-size:.9rem}
.det-nm{font-size:.75rem;font-weight:600;color:#1a1f36}
.det-val{font-size:.75rem;font-weight:600;color:#1a1f36}
.det-val.na{color:#9ca3af}
.msg-box{margin:12px 0;padding:14px;border-radius:12px;font-size:.72rem;font-weight:600;display:flex;align-items:center;gap:8px}
.msg-box.warn{background:rgba(37,99,235,.05);color:#2563eb;border:1px solid rgba(37,99,235,.12)}
.msg-box.ok{background:rgba(22,163,74,.05);color:#16a34a;border:1px solid rgba(22,163,74,.12)}

/* === PAGE: BENEFICIOS === */
.ben-hero{background:linear-gradient(135deg,#e8edf3,#dfe5ed);border-radius:16px;padding:20px;display:flex;gap:14px;align-items:center;margin:12px 0}
.ben-icon{font-size:2rem}
.ben-title{font-size:.85rem;font-weight:700;color:#1a1f36}
.ben-sub{font-size:.6rem;color:#6b7280;margin-top:2px}
.rew-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
.rew{background:#fff;border-radius:10px;padding:10px 8px;border:1px solid #e5e7eb;text-align:center}
.rew.hl{border-color:#d4a937;border-width:2px}
.rew-val{font-size:.82rem;font-weight:800;color:#1a1f36}
.rew-lbl{font-size:.45rem;color:#9ca3af;margin-top:2px}
.ben-list{margin:12px 0}
.ben-item{display:flex;align-items:center;gap:12px;padding:14px;background:#fff;border-radius:12px;border:1px solid #e5e7eb;margin-bottom:6px}
.ben-item-icon{width:36px;height:36px;border-radius:10px;background:#f0f2f5;display:flex;align-items:center;justify-content:center;font-size:1rem}
.ben-item-info{flex:1}
.ben-item-nm{font-size:.75rem;font-weight:700;color:#1a1f36}
.ben-item-desc{font-size:.58rem;color:#9ca3af}
.ben-item-lock{font-size:1rem;opacity:.4}

/* === PAGE: TREINAMENTO === */
.tre-hero{background:linear-gradient(135deg,#1a3558,#0f2440);border-radius:16px;padding:24px 20px;color:#fff;text-align:center;margin:12px 0}
.tre-hero-icon{font-size:2rem;margin-bottom:8px}
.tre-hero-t{font-size:.85rem;font-weight:700}
.tre-hero-s{font-size:.6rem;opacity:.5;margin-top:4px}
.tre-list{margin:12px 0}
.tre-item{display:flex;align-items:center;gap:12px;padding:14px;background:#fff;border-radius:12px;border:1px solid #e5e7eb;margin-bottom:6px}
.tre-item-icon{width:36px;height:36px;border-radius:10px;background:#f0f2f5;display:flex;align-items:center;justify-content:center;font-size:.9rem}
.tre-item-info{flex:1}
.tre-item-nm{font-size:.75rem;font-weight:700;color:#1a1f36}
.tre-item-desc{font-size:.55rem;color:#9ca3af}
.tre-item-arrow{color:#d1d5db;font-size:.8rem}
.tre-prog{height:6px;background:#e5e7eb;border-radius:4px;overflow:hidden;margin-top:6px}
.tre-prog-fill{height:100%;background:#16a34a;border-radius:4px}
.tre-badge{font-size:.5rem;font-weight:700;padding:2px 8px;border-radius:10px;background:rgba(22,163,74,.08);color:#16a34a}

/* MAIS MENU */
.menu-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;display:none}
.menu-bg.on{display:block}
.menu-sheet{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:20px 20px 0 0;padding:12px 16px max(24px,env(safe-area-inset-bottom));z-index:61;transform:translateY(100%);transition:transform .25s}
.menu-bg.on .menu-sheet{transform:translateY(0)}
.menu-h{width:40px;height:4px;background:#d1d5db;border-radius:4px;margin:0 auto 16px}
.menu-item{display:flex;align-items:center;gap:12px;width:100%;padding:14px 12px;border:none;background:none;font-size:.82rem;font-weight:600;color:#1a1f36;font-family:inherit;cursor:pointer;border-radius:10px;text-align:left}
.menu-item:active{background:#f3f4f6}
.menu-item.out{color:#ef4444;margin-top:8px;border-top:1px solid #e5e7eb;padding-top:14px;border-radius:0}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="loginScreen">
<div class="login-box">
<div class="login-logo">🏛️ Édimo · Soluções em Cobranças</div><div style="font-size:.45rem;color:#ccc;margin-top:-20px;margin-bottom:12px">v4</div>
<input type="text" id="loginUser" placeholder="Nome ou Login" autocomplete="off">
<input type="password" id="loginPass" placeholder="Senha">
<button class="login-btn" onclick="doLogin()">Entrar</button>
<div class="login-err" id="loginErr">Usuário ou senha incorretos</div>
<div class="login-load" id="loginLoad">Verificando...</div>
</div>
</div>

<!-- APP -->
<div class="app" id="app">

<!-- PAGES -->
<div class="pg on" id="pgInicio"></div>
<div class="pg" id="pgAcordos"></div>
<div class="pg" id="pgComp"></div>
<div class="pg" id="pgTreino"></div>

<!-- BOTTOM BAR -->
<div class="bar">
<button class="bar-btn on" data-t="inicio" onclick="go('inicio')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg><span>Início</span></button>
<button class="bar-btn" data-t="acordos" onclick="go('acordos')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg><span>Acordos</span></button>
<button class="bar-btn" data-t="comp" onclick="go('comp')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg><span>Comparativo</span></button>
<button class="bar-btn" data-t="treino" onclick="go('treino')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2zM22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg><span>Treinamento</span></button>
<button class="bar-btn" data-t="mais" onclick="openMenu()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg><span>Mais</span></button>
</div>
</div>

<!-- MAIS MENU -->
<div class="menu-bg" id="menuBg" onclick="closeMenu()">
<div class="menu-sheet" onclick="event.stopPropagation()">
<div class="menu-h"></div>
<button class="menu-item" onclick="closeMenu();go('comissao')">💰 Comissão</button>
<button class="menu-item" onclick="closeMenu();go('beneficios')">🎯 Benefícios e Regras</button>
<button class="menu-item" onclick="closeMenu();go('faltas')">🔔 Faltas do Dia</button>
<button class="menu-item out" onclick="doLogout()">🚪 Sair</button>
</div>
</div>

<script>
// === CONFIG ===
var SH='https://docs.google.com/spreadsheets/d/e/2PACX-1vS9gWUTuOKx-WK8-p3vk93yJunFAuqVYrdxqPTzuJg3UIAX5GkVOC2wkD_DXIKE9nf0P9xDOgfHwAUZ/pub?gid=92433521&single=true&output=csv';
var RK='https://docs.google.com/spreadsheets/d/e/2PACX-1vRjHX1-Uu8HaBwa7iT_5XSTNkcp2pbSTKTsVsygCKucMChmcI4hTZkC_pNEsuFNeQ/pub?output=csv';
var PT='https://docs.google.com/spreadsheets/d/e/2PACX-1vS9gWUTuOKx-WK8-p3vk93yJunFAuqVYrdxqPTzuJg3UIAX5GkVOC2wkD_DXIKE9nf0P9xDOgfHwAUZ/pub?output=csv';
var CP_M1='https://docs.google.com/spreadsheets/d/e/2PACX-1vRd-WnBwsOyBqVeunc1jH3sTzou9KGZllzJYA1QpKC_wk21Y4Cw9A2KprRbowWDRw/pub?output=csv';
var CP_M2='https://docs.google.com/spreadsheets/d/e/2PACX-1vTgVTpekyWnlnCtyKnOgisBZ9YM8WOOoNGe6XKH2PslfxaI3GIdjt4g_hEtLJtqYQ/pub?output=csv';
var CP_NOW='https://docs.google.com/spreadsheets/d/e/2PACX-1vRrs4woT4Rad3tsqEnkRBkBy4mOvXlP-3s24bIOQ3gaxRgPjfH3Lqw4PgMa1qfo-Q/pub?output=csv';

var cU=null,rankData=null,pontoData=null,compData=null;
var allEntradas={},allLogins={},allAdmissao={};

// === UTILS ===
function fm(v){return'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fs(v){return'R$ '+Math.round(v).toLocaleString('pt-BR')}
function parseBR(s){if(!s)return 0;s=s.replace(/"/g,'').trim();if(!s||s==='0')return 0;s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)||0;}
function cn(r){r=r.replace(/^[Zz]-?\d*\.?/,'');var n=r.replace(/^[\d]+\.?(\d+\.)?/,'');return n.split('.').map(function(p){return p?p.charAt(0).toUpperCase()+p.slice(1).toLowerCase():''}).filter(function(p){return p}).join(' ')}
function normN(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z\s]/g,'').trim()}
function simil(a,b){if(a===b)return true;if(a.length>3&&b.length>3&&(a.startsWith(b.substring(0,3))||b.startsWith(a.substring(0,3)))){var mx=Math.max(a.length,b.length),mn=Math.min(a.length,b.length);if(mx-mn>3)return false;var d=mx-mn;for(var i=0;i<mn;i++){if(a[i]!==b[i])d++}return d<=2}return false}

function loginToShift(login){
  if(!login)return'';var p=login.charAt(0);
  if(p==='1')return'08:00';if(p==='2')return'14:00';if(p==='4')return'08:30';if(p==='0')return'14:00';
  if(p==='5'){if(login.toLowerCase().includes('evelin'))return'08:00';if(login.toLowerCase().includes('livia'))return'14:00'}
  return'';
}

function matchPonto(opName){
  if(!pontoData||!opName)return null;
  var a=normN(opName).split(/\s+/).filter(function(x){return x});if(!a.length)return null;
  var best=null,bestScore=0;
  for(var i=0;i<pontoData.length;i++){
    var p=pontoData[i],b=normN(p.nome).split(/\s+/).filter(function(x){return x});if(!b.length)continue;
    var score=0,lastA=a[a.length-1],lastB=b[b.length-1];
    if(lastA===lastB)score+=10;
    var surA=a.slice(1),surB=b.slice(1);
    for(var j=0;j<surA.length;j++){for(var k=0;k<surB.length;k++){if(surA[j]===surB[k])score+=5}}
    if(a[0]===b[0])score+=3;else if(simil(a[0],b[0]))score+=2;
    if(score<2)continue;if(score>bestScore){bestScore=score;best=p}
  }
  return best;
}

function shiftStarted(opName){
  var t=getShiftTime(opName);if(!t)return true;
  var parts=t.match(/(\d{1,2})[:\.]?(\d{2})?/);if(!parts)return true;
  var sh=parseInt(parts[1]),sm=parseInt(parts[2]||'0');
  var now=new Date(),shiftMin=sh*60+sm+15,nowMin=now.getHours()*60+now.getMinutes();
  return nowMin>=shiftMin;
}

function getShiftTime(opName){
  if(!opName||!allEntradas)return null;
  var a=normN(opName).split(/\s+/).filter(function(x){return x});if(!a.length)return null;
  for(var key in allEntradas){
    var b=normN(key).split(/\s+/).filter(function(x){return x});if(!b.length)continue;
    var lastA=a[a.length-1],lastB=b[b.length-1];var score=0;
    if(lastA===lastB)score+=10;if(a[0]===b[0])score+=3;else if(simil(a[0],b[0]))score+=2;
    if(score>=5)return allEntradas[key];
  }
  return null;
}

function pontoStatus(p,opName){
  if(!p)return'off';var s=p.status.toUpperCase();
  if(s.includes('PRESENTE'))return'ok';if(s.includes('ATRASADO'))return'late';
  if(!shiftStarted(opName||p.nome))return'pending';return'miss';
}

function getTurno(opName){
  if(!opName)return'';var a=normN(opName).split(/\s+/).filter(function(x){return x});if(!a.length)return'';
  for(var key in allLogins){
    var b=normN(key).split(/\s+/).filter(function(x){return x});if(!b.length)continue;
    var lastA=a[a.length-1],lastB=b[b.length-1];var score=0;
    if(lastA===lastB)score+=10;if(a[0]===b[0])score+=3;else if(simil(a[0],b[0]))score+=2;
    if(score>=5){var p=allLogins[key].charAt(0);if(p==='1')return'm';if(p==='2')return't';if(p==='0')return'n';return''}
  }
  return'';
}

function isOperator(name){
  if(!name)return false;var a=normN(name).split(/\s+/).filter(function(x){return x});if(!a.length)return false;
  for(var key in allLogins){
    var b=normN(key).split(/\s+/).filter(function(x){return x});if(!b.length)continue;
    var lastA=a[a.length-1],lastB=b[b.length-1];var score=0;
    if(lastA===lastB)score+=10;
    if(a[0]===b[0])score+=3;else if(simil(a[0],b[0]))score+=2;
    // Require both first name AND surname match (score >= 12)
    if(score>=12){var p=allLogins[key].charAt(0);return p==='0'||p==='1'||p==='2'}
  }
  return false;
}

function parseCSVRows(text){

}

function loadRanking(){
  return fetch(RK+'&t='+Date.now()).then(function(r){return r.text()}).then(function(csv){
    var lines=csv.split('\n'),dt='',hI=-1;
    for(var i=0;i<lines.length;i++){var m=lines[i].match(/(\d{2}\/\d{2}\/\d{4})\s*at/);if(m){dt=m[1];break}}
    for(var i=0;i<lines.length;i++){if(lines[i].includes(',Operador,')){hI=i;break}}
    if(hI===-1)return;
    var ops=[],ta=0,tv=0;
    for(var i=hI+1;i<lines.length;i++){
      var cells=[];var j=0,cell='',inQ=false;var line=lines[i];if(!line.trim())continue;
      while(j<line.length){var c=line[j];if(c==='"')inQ=!inQ;else if(c===','&&!inQ){cells.push(cell);cell=''}else cell+=c;j++}cells.push(cell);
      var name='';for(var k=0;k<cells.length;k++){if(cells[k].trim()){name=cells[k].trim();break}}
      if(!name||name.toLowerCase().includes('suporte.139'))continue;
      var allNums=[];for(var k=0;k<cells.length;k++){var v=cells[k].trim().replace(/"/g,'');if(v&&v.match(/[\d]/)){var n=parseBR(v);if(!isNaN(n))allNums.push({n:n})}}
      if(allNums.length<2)continue;
      var totalVal=allNums[allNums.length-1].n,totalQtd=Math.round(allNums[allNums.length-2].n);
      if(name==='Totais'){ta=totalQtd;tv=totalVal;continue}
      if(totalQtd===0&&totalVal===0)continue;
      var prefix=name.charAt(0);
      if(prefix!=='0'&&prefix!=='1'&&prefix!=='2')continue;
      ops.push({n:cn(name),a:totalQtd,v:Math.round(totalVal*100)/100});
    }
    ops.sort(function(a,b){return b.a-a.a||b.v-a.v});
    rankData={d:dt,ta:ta,tv:Math.round(tv*100)/100,ops:ops};
  }).catch(function(){});
}

function loadPonto(){
  return fetch(PT+'&t='+Date.now()).then(function(r){return r.text()}).then(function(csv){
    var lines=csv.split('\n'),rows=[];
    for(var i=1;i<lines.length;i++){
      var cells=[],cell='',inQ=false;
      for(var j=0;j<lines[i].length;j++){var c=lines[i][j];if(c==='"')inQ=!inQ;else if(c===','&&!inQ){cells.push(cell.trim());cell=''}else cell+=c}
      cells.push(cell.trim());
      if(cells[0]&&!cells[0].includes('RESUMO')&&!cells[0].includes('---'))rows.push({nome:cells[0],status:cells[1]||'',entrada:cells[2]||'',saida:cells[3]||'',batidas:cells[4]||''});
    }
    pontoData=rows;

}

function loadEntradas(){

var compLoaded=false;
var compMonths=[];

function loadCompData(){
  if(compLoaded)return Promise.resolve();
  return Promise.all([
    fetch(CP_M1+'&t='+Date.now()).then(function(r){return r.text()}),
    fetch(CP_M2+'&t='+Date.now()).then(function(r){return r.text()}),
    fetch(CP_NOW+'&t='+Date.now()).then(function(r){return r.text()})
  ]).then(function(results){
    compMonths=results.map(function(csv){return parseCompCSV(csv)});
    compLoaded=true;
  }).catch(function(){});
}

function parseCompCSV(csv){
  var lines=csv.split('\n');
  var period='',hI=-1;
  for(var i=0;i<lines.length;i++){
    var m=lines[i].match(/(\w+\/\d{4})/);if(m&&!period)period=m[1];
    if(lines[i].includes(',Operador,')||lines[i].includes('Operador')){hI=i;break}
  }
  if(hI===-1)return{period:period,ops:[]};
  var ops=[];
  for(var i=hI+1;i<lines.length;i++){
    var cells=[],cell='',inQ=false,line=lines[i];if(!line.trim())continue;
    for(var j=0;j<line.length;j++){var c=line[j];if(c==='"')inQ=!inQ;else if(c===','&&!inQ){cells.push(cell);cell=''}else cell+=c}cells.push(cell);
    var name='';for(var k=0;k<cells.length;k++){if(cells[k].trim()){name=cells[k].trim();break}}
    if(!name||name.toLowerCase().includes('totai')||name.toLowerCase().includes('total'))continue;
    var prefix=name.charAt(0);if(prefix!=='0'&&prefix!=='1'&&prefix!=='2')continue;
    var nums=[];for(var k=0;k<cells.length;k++){var v=cells[k].trim().replace(/"/g,'');if(v&&v.match(/[\d]/)){var n=parseBR(v);if(!isNaN(n))nums.push(n)}}
    if(nums.length<2)continue;
    ops.push({n:cn(name),a:Math.round(nums[nums.length-2]),v:Math.round(nums[nums.length-1]*100)/100});
  }
  return{period:period,ops:ops};
}

function mU(op,u){
  if(!u)return false;
  var a=op.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  // Try login-based match first (most reliable)
  if(cU&&cU.login){
    var lg=cU.login.replace(/^\d+\.?/,'').replace(/\./g,' ').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    var lps=lg.split(/\s+/).filter(function(p){return p.length>2});
    if(lps.length>=2){
      // Require ALL login name parts to match
      if(lps.every(function(p){return a.includes(p)}))return true;
      return false; // If we have a login, only match by login
    }
  }
  // Fallback: match by typed name
  var b=u.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  var ps=b.split(' ').filter(function(p){return p.length>2});
  if(ps.length>=2&&ps.every(function(p){return a.includes(p)}))return true;
  return false;
}

    var uN=cU?cU.nome.toLowerCase():'';

    h+='<div class="cc"><div class="cc-lbl">M\u00E9dia/acordo</div><div class="cc-val" style="font-size:.85rem">'+fm(avgPerAcordo)+'</div><div class="cc-pct'+(varAvg<0?' neg':'')+'">\u25B2 '+(varAvg>=0?'+':'')+varAvg+'%</div></div>';
    h+='</div>';
    
    // Chart bars
    h+='<div class="chart-box"><div class="chart-title">\uD83D\uDCC8 Compara\u00E7\u00E3o com meses anteriores</div>';
    h+='<div class="chart-bars">';
    var maxV=Math.max(old?old.v:0,prev?prev.v:0,curV,1);
    compMonths.forEach(function(m,i){
      var d=myData[i],v=d?d.v:0,a=d?d.a:0;
      var pct=Math.round(v/maxV*100);
      var isCur=i===2;
      h+='<div class="chart-col"><div class="chart-bar val" style="height:'+pct+'%;background:'+(isCur?'#2563eb':'#d1d5db')+'"></div>';
      h+='<div class="chart-lbl" style="'+(isCur?'color:#2563eb;font-weight:700':'')+'">'+((m&&m.period)?m.period:'--')+'</div>';
      h+='<div class="chart-v">'+fs(v)+'</div><div class="chart-a">'+a+' acordos</div></div>';
    });
    h+='</div></div>';
    
    // Variation
    h+='<div class="var-box"><div class="var-title">\uD83D\uDCC8 Varia\u00E7\u00E3o do per\u00EDodo</div>';
    h+='<div class="var-grid">';
    h+='<div class="var-item"><div class="var-pct'+(varV<0?' neg':'')+'">'+((varV>=0?'+':'')+varV+'%')+'</div><div class="var-lbl">Valor<br>(vs. m\u00EAs anterior)</div></div>';
    h+='<div class="var-item"><div class="var-pct'+(varA<0?' neg':'')+'">'+((varA>=0?'+':'')+varA+'%')+'</div><div class="var-lbl">Acordos<br>(vs. m\u00EAs anterior)</div></div>';
    h+='<div class="var-item"><div class="var-pct'+(varAvg<0?' neg':'')+'">'+((varAvg>=0?'+':'')+varAvg+'%')+'</div><div class="var-lbl">M\u00E9dia/acordo<br>(vs. m\u00EAs anterior)</div></div>';

// === RENDER: FALTAS ===
function renderFaltas(){
  var h='<div class="hdr"><div class="hdr-l"><div class="hdr-title">\uD83D\uDD14 Faltas do Dia</div></div></div><div style="padding:0 14px 16px">';
  if(pontoData){
    var faltas=pontoData.filter(function(p){var s=p.status.toUpperCase();return!s.includes('PRESENTE')&&!s.includes('ATRASADO')&&shiftStarted(p.nome)});
    if(faltas.length===0)h+='<div style="text-align:center;padding:40px;color:#9ca3af;font-size:.8rem">\uD83C\uDF89 Nenhuma falta hoje!</div>';
    else{h+='<div style="font-size:.7rem;color:#9ca3af;margin:12px 0">'+faltas.length+' aus\u00EAncia(s)</div>';
    faltas.forEach(function(p){var nm=p.nome.split(/\s+/).map(function(w){return w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()}).join(' ');h+='<div class="rw"><div class="rw-av" style="background:#fecaca;color:#ef4444">\u2717</div><div class="rw-info"><div class="rw-nm">'+nm+'</div></div></div>'})}
  }else h+='<div style="text-align:center;padding:40px;color:#9ca3af">Dados indispon\u00EDveis</div>';
  h+='</div>';
  document.getElementById('pgComp').innerHTML=h;
}
